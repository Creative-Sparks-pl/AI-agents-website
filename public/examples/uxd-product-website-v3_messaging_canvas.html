  <!-- MESSAGING-SPECIFIC ADAPTER (populated in Step 4) -->
  <script>
  (function() {
    /* MESSAGING-SPECIFIC ADAPTER — renderers, filter axes, cell-click, MD formatter. Calls window.__shell API. */

    if (!window.__shell) return; // Block 1 must be present

    var _data     = window.__shell.getData();
    var LABELS    = window.__shell.getLabels();
    var VARIANTS  = _data.variants || [];

    // Portfolio mode: when the workflow runs in portfolio branching
    // (multi-product / umbrella + line), Step 12 populates VARIANTS with
    // one entry per variant. The shell's page switcher automatically
    // shows one page per variant. Single-variant projects populate a
    // single VARIANTS entry and the page switcher hides itself.

    var _activeVariant = VARIANTS[0];

    // ---- Panel element references (via __shell internals) ----
    var panelBody       = window.__shell._panelBody;
    var panelHeader     = window.__shell._panelHeader;
    var panelFilterArea = window.__shell._panelFilterArea;

    // ---- Variant switcher ----
    var pageSelect = document.getElementById('shellPageSelect');
    if (pageSelect) {
      if (VARIANTS.length > 1) {
        pageSelect.innerHTML = VARIANTS.map(function(v) {
          return '<option value="' + v.slug + '">' + v.label + '</option>';
        }).join('');
        var selectContainer = pageSelect.closest('.shell-bottombar__group') || pageSelect.parentElement;
        if (selectContainer) selectContainer.style.display = '';
        pageSelect.addEventListener('change', function(e) {
          setActiveVariant(e.target.value);
        });
      } else {
        var selectContainer2 = pageSelect.closest('.shell-bottombar__group') || pageSelect.parentElement;
        if (selectContainer2) selectContainer2.style.display = 'none';
      }
    }

    function setActiveVariant(slug) {
      _activeVariant = VARIANTS.find(function(v) { return v.slug === slug; }) || VARIANTS[0];
      renderCanvas();
      if (_activeView === 'copy') {
        renderCopy();
        renderCopyList();
      } else {
        renderList();
      }
    }

    // ---- Register filter axes ----
    window.__shell.registerFilter('row', [
      { value: 'all',          label: LABELS.filter_row_all },
      { value: 'context',      label: LABELS.row_context },
      { value: 'problem-fit',  label: LABELS.row_problem_fit },
      { value: 'pillars',      label: LABELS.row_pillars },
      { value: 'messaging',    label: LABELS.row_messaging },
      { value: 'narrative',    label: LABELS.row_narrative }
    ], { label: LABELS.filter_row_header });

    window.__shell.registerFilter('confidence', [
      { value: 'all',    label: LABELS.filter_conf_all },
      { value: 'high',   label: LABELS.conf_high },
      { value: 'medium', label: LABELS.conf_medium },
      { value: 'low',    label: LABELS.conf_low }
    ], { label: LABELS.filter_conf_header });

    window.__shell.registerFilter('flag', [
      { value: 'all',              label: LABELS.filter_flag_all },
      { value: 'missing-evidence', label: LABELS.filter_flag_missing_evidence },
      { value: 'no-flags',         label: LABELS.filter_flag_no_flags }
    ], { label: LABELS.filter_flag_header });

    // ---- Register back-to-list callback — Block 1 back button calls this directly.
    // Dispatches by active view so Copy view gets the block list, not cells.
    window.__shell.onBackToList(function() {
      if (_activeView === 'copy') renderCopyList();
      else renderList();
    });

    // ---- Filter change: hide/show shell-items (only fires in list view) ----
    window.__shell.onFilterChange(function(state) {
      if (window.__shell._getView() === 'list') {
        _applyItemFilter(state);
      }
      // In detail view, filter changes are ignored — back button triggers renderList via onBackToList
    });

    function _applyItemFilter(state) {
      if (!panelBody) return;
      var rowSel  = state['row']        || [];
      var confSel = state['confidence'] || [];
      var flagSel = state['flag']       || [];

      var items  = panelBody.querySelectorAll('.shell-item');
      var groups = panelBody.querySelectorAll('.shell-group');

      items.forEach(function(item) {
        var cellId   = item.getAttribute('data-cell-id');
        var cell     = _findCell(cellId);
        if (!cell) { item.classList.add('is-hidden'); return; }

        var rowOk  = rowSel.length === 0 || rowSel.indexOf(cell.row) !== -1;
        var confOk = confSel.length === 0 || confSel.indexOf(cell.rec.confidence) !== -1;
        var flagOk = flagSel.length === 0 || flagSel.indexOf(_cellFlag(cell)) !== -1;

        item.classList.toggle('is-hidden', !(rowOk && confOk && flagOk));
      });

      groups.forEach(function(g) {
        var visible = g.querySelectorAll('.shell-item:not(.is-hidden)');
        g.classList.toggle('is-hidden', visible.length === 0);
      });
    }

    function _cellFlag(cell) {
      // A pillar cell (structure: dimensions[] present) has missing evidence if any dimension has badge "No evidence"
      if (cell.dimensions && cell.dimensions.length) {
        var hasMissing = cell.dimensions.some(function(d) {
          return d.badge && d.badge.value === 'no_evidence';
        });
        return hasMissing ? 'missing-evidence' : 'no-flags';
      }
      return 'no-flags';
    }

    function _findCell(id) {
      if (!_activeVariant) return null;
      return (_activeVariant.cells || []).find(function(c) { return c.id === id; }) || null;
    }

    // ---- Row ordering ----
    var ROW_ORDER = ['context', 'problem-fit', 'pillars', 'messaging', 'narrative'];
    // Row label lookup — values are LABELS keys; text comes from LABELS[key]
    // so translations stay routed through the single label registry.
    var ROW_LABELS = {
      'context':     'row_context',
      'problem-fit': 'row_problem_fit',
      'pillars':     'row_pillars',
      'messaging':   'row_messaging',
      'narrative':   'row_narrative'
    };
    function _rowLabel(row) {
      var k = ROW_LABELS[row];
      return k && LABELS[k] != null ? LABELS[k] : row;
    }

    // ---- Confidence badge helpers ----
    // Entry shape: { labelKey: <LABELS key>, cls: <css class> }.
    var CONF_BADGE = {
      'high':   { labelKey: 'conf_high',   cls: 'mc-badge--green' },
      'medium': { labelKey: 'conf_medium', cls: 'mc-badge--yellow' },
      'low':    { labelKey: 'conf_low',    cls: 'mc-badge--red' }
    };
    function _confBadge(level) {
      var m = CONF_BADGE[level];
      if (!m) return '';
      var label = LABELS[m.labelKey] != null ? LABELS[m.labelKey] : m.labelKey;
      return '<span class="mc-badge ' + m.cls + '">' + label + '</span>';
    }

    // ---- Cell header: just the title. Confidence lives in the mc-proof
    // bullet at the bottom of the cell; duplicating it next to the heading
    // was noisy, so the header only holds the title.
    function _cellHeader(cell) {
      return '<div class="ui-card__header">' +
        '<h4>' + (cell.name || cell.id) + '</h4>' +
        '</div>';
    }

// ---- Classification badge maps ----
    // Entry shape: { cls: <css class>, labelKey: <LABELS key> }.
    var CLASS_BADGE = {
      'differentiator': { cls: 'mc-badge--green',  labelKey: 'class_differentiator' },
      'table-stake':    { cls: 'mc-badge--grey',   labelKey: 'class_table_stake' },
      'delighter':      { cls: 'mc-badge--purple', labelKey: 'class_delighter' }
    };
    var WEIGHT_BADGE = {
      'must-have':         { cls: 'mc-badge--grey',   labelKey: 'weight_must_have' },
      'deciding':          { cls: 'mc-badge--green',  labelKey: 'weight_deciding' },
      'pleasant-surprise': { cls: 'mc-badge--purple', labelKey: 'weight_pleasant_surprise' }
    };
    function _badgeLabel(entry) {
      if (!entry) return '';
      return LABELS[entry.labelKey] != null ? LABELS[entry.labelKey] : (entry.labelKey || '');
    }
    var WEIGHT_ORDER = ['must-have', 'deciding', 'pleasant-surprise'];

    // ---- renderCanvas() — builds canvas grid from _activeVariant.cells ----
    function renderCanvas() {
      var canvasRoot = document.getElementById('canvasRoot');
      if (!canvasRoot) return;

      var cells = (_activeVariant && _activeVariant.cells) ? _activeVariant.cells : [];

      // Group cells by row, preserving ROW_ORDER sequence
      var groups = {};
      ROW_ORDER.forEach(function(row) { groups[row] = []; });
      cells.forEach(function(cell) {
        if (groups[cell.row]) groups[cell.row].push(cell);
        else { groups[cell.row] = [cell]; }
      });

      var variantLabel = _activeVariant && _activeVariant.label ? ' — ' + _activeVariant.label : '';
      var html = '<header class="ui-page-header">' +
        '<h1>' + LABELS.page_canvas_title + _escapeHtml(variantLabel) + '</h1>' +
        '<p class="ui-page-header__subtitle">' + LABELS.page_canvas_subtitle + '</p>' +
        '</header>';

      ROW_ORDER.forEach(function(row) {
        var rowCells = groups[row];
        if (!rowCells || rowCells.length === 0) return;

        var labelKey = ROW_LABELS[row] || row;
        var labelText = _rowLabel(row);

        // Skip narrative row if it has no cells (it is conditional)
        if (row === 'narrative' && rowCells.length === 0) return;

        // Row title heading
        html += '<h2 class="mc-row-title" data-row="' + row + '" data-label-key="' + labelKey + '">' + labelText + '</h2>';

        // Narrative row: single full-width column (no grid modifier)
        var rowClass = (row === 'narrative') ? 'mc-row' : ('mc-row mc-row--' + (row === 'problem-fit' ? 'problem' : row));

        html += '<section class="' + rowClass + '">';
        rowCells.forEach(function(cell) {
          html += _renderCanvasCell(cell);
        });
        html += '</section>';
      });

      canvasRoot.innerHTML = html;
    }

    // Copy block registry — drives both the copy doc render and the
    // copy-view panel list. Order here is the on-page order.
    var COPY_BLOCKS = [
      { key: 'hero',         label: LABELS.copy_block_hero },
      { key: 'socialProof',  label: LABELS.copy_block_social_proof },
      { key: 'valueProps',   label: LABELS.copy_block_value_props },
      { key: 'howItWorks',   label: LABELS.copy_block_how_it_works },
      { key: 'whyUs',        label: LABELS.copy_block_why_us },
      { key: 'artifacts',    label: LABELS.copy_block_artifacts },
      { key: 'packages',     label: LABELS.copy_block_packages },
      { key: 'auditPitch',   label: LABELS.copy_block_audit_pitch },
      { key: 'installPitch', label: LABELS.copy_block_install_pitch },
      { key: 'faq',          label: LABELS.copy_block_faq }
    ];
    function _copyBlockLabel(key) {
      var b = COPY_BLOCKS.find(function(x) { return x.key === key; });
      return b ? b.label : key;
    }

    // ---- renderCopy() — builds the copy doc from _activeVariant.copy ----
    function renderCopy() {
      var copyRoot = document.getElementById('copyRoot');
      if (!copyRoot) return;
      var copy = (_activeVariant && _activeVariant.copy) || null;
      if (!copy) {
        copyRoot.innerHTML = '<p style="max-width:var(--mc-copy-max-width);margin:0 auto;padding:32px 16px;color:var(--wf-muted);">' + LABELS.page_copy_empty + '</p>';
        return;
      }
      var h = function(s) { return _escapeHtml(String(s || '')); };
      var variantLabel = _activeVariant && _activeVariant.label ? ' — ' + _activeVariant.label : '';
      var html = '<div class="mc-copy-page">' +
        '<header class="ui-page-header">' +
          '<h1>' + LABELS.page_copy_title + h(variantLabel) + '</h1>' +
          '<p class="ui-page-header__subtitle">' + LABELS.page_copy_subtitle + '</p>' +
        '</header>' +
        '<div class="mc-copy-doc">';

      // Urgency bar (optional)
      if (copy.urgencyBar && copy.urgencyBar.text) {
        html += '<div class="mc-copy-urgency-bar" data-copy-block="urgencyBar">' + h(copy.urgencyBar.text) + '</div>';
      }
      // Hero
      var hero = copy.hero || {};
      html += '<section class="ui-card ui-card--copy" data-copy-block="hero">' +
        '<h2>' + LABELS.copy_block_hero + '</h2>' +
        '<h1 class="mc-copy-headline">' + h(hero.headline) + '</h1>' +
        '<p class="mc-copy-subhead">' + h(hero.subhead) + '</p>' +
        (hero.primaryCta ? '<a class="mc-copy-cta">' + h(hero.primaryCta) + '</a>' : '') +
        (hero.secondaryCta ? '<a class="mc-copy-cta mc-copy-cta--secondary">' + h(hero.secondaryCta) + '</a>' : '') +
        (hero.visualHint ? '<div class="mc-copy-visual-hint">' + h(hero.visualHint) + '</div>' : '') +
        '</section>';

      // Social proof
      var sp = copy.socialProof || {};
      if (sp.metric || sp.logos || sp.quote) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="socialProof">' +
          '<h2>' + LABELS.copy_block_social_proof + '</h2>' +
          '<div class="mc-copy-social-proof">' +
          (sp.metric ? '<div class="mc-copy-metric">' + h(sp.metric) + '</div>' : '') +
          (sp.logos ? '<div class="mc-copy-logos">' + h(sp.logos) + '</div>' : '') +
          (sp.quote ? '<blockquote class="mc-copy-quote">' + h(sp.quote) +
            (sp.attribution ? ' — ' + h(sp.attribution) : '') + '</blockquote>' : '') +
          '</div>' +
          '</section>';
      }

      // Value propositions (pillars)
      var vp = copy.valueProps || {};
      var vps = Array.isArray(vp.items) ? vp.items : [];
      if (vps.length) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="valueProps"><h2>' + LABELS.copy_block_value_props + '</h2><div class="mc-copy-pillars">';
        vps.forEach(function(item) {
          var proofCls = item.isHypothesis ? 'mc-copy-proof-ref mc-copy-proof-ref--hypothesis' : 'mc-copy-proof-ref';
          var proofPrefix = item.isHypothesis ? '' : '→ ';
          html += '<div class="mc-copy-pillar">' +
            '<h3>' + h(item.headline) + '</h3>' +
            '<p class="mc-copy-pillar-body">' + h(item.body) + '</p>' +
            (item.proofRef ? '<div class="' + proofCls + '">' + proofPrefix + h(item.proofRef) + '</div>' : '') +
            '</div>';
        });
        html += '</div></section>';
      }

      // Artifacts gallery
      var art = copy.artifacts || {};
      var artItems = Array.isArray(art.items) ? art.items : [];
      if (artItems.length || art.intro) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="artifacts"><h2>' + LABELS.copy_block_artifacts + '</h2>';
        if (art.intro) html += '<p class="mc-copy-block-intro">' + h(art.intro) + '</p>';
        if (artItems.length) {
          html += '<div class="mc-copy-cards">';
          artItems.forEach(function(item) {
            html += '<div class="mc-copy-card">' +
              '<p class="mc-copy-card-name">' + h(item.name || '') + '</p>' +
              (item.contains ? '<p class="mc-copy-card-desc">' + h(item.contains) + '</p>' : '') +
              '</div>';
          });
          html += '</div>';
        }
        if (art.ctaPrimary) html += '<a class="mc-copy-block-cta">' + h(art.ctaPrimary) + '</a>';
        html += '</section>';
      }
      // How it works (steps)
      var hiw = copy.howItWorks || {};
      var steps = Array.isArray(hiw.items) ? hiw.items : [];
      if (steps.length) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="howItWorks"><h2>' + LABELS.copy_block_how_it_works + '</h2><div class="mc-copy-steps">';
        steps.forEach(function(s) {
          html += '<div class="mc-copy-step"><div><strong>' + h(s.name) + '</strong> — ' + h(s.description) + '</div></div>';
        });
        html += '</div></section>';
      }

      // Why us
      var wu = copy.whyUs || {};
      var comparisons = Array.isArray(wu.comparisons) ? wu.comparisons : [];
      if (comparisons.length || wu.opener) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="whyUs">' +
          '<h2>' + LABELS.copy_block_why_us + '</h2>';
        if (wu.opener) {
          html += '<p class="mc-copy-comparison-opener">' + h(wu.opener) + '</p>';
        }
        html += '<div class="mc-copy-comparisons">';
        comparisons.forEach(function(c) {
          var takeaway = c.takeaway || '';
          var subline = c.subline || '';
          var vs = c.vs || c.alternative || '';
          var body = c.body || c.contrast || '';
          html += '<div class="mc-copy-comparison-card">';
          if (takeaway) {
            html += '<p class="mc-copy-comparison-takeaway">' + h(takeaway) + '</p>';
          }
          if (subline) {
            html += '<p class="mc-copy-comparison-subline">' + h(subline) + '</p>';
          } else if (vs) {
            html += '<p class="mc-copy-comparison-subline">Wobec ' + h(vs) + '</p>';
          }
          if (body) {
            html += '<p class="mc-copy-comparison-body">' + h(body) + '</p>';
          }
          html += '</div>';
        });
        html += '</div></section>';
      } else if (wu.body) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="whyUs">' +
          '<h2>' + LABELS.copy_block_why_us + '</h2>' +
          '<p style="color:var(--wf-text);line-height:1.6;margin:0;">' + h(wu.body) + '</p>' +
          '</section>';
      }

      // Packages
      var pkg = copy.packages || {};
      var pkgItems = Array.isArray(pkg.items) ? pkg.items : [];
      if (pkgItems.length || pkg.intro) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="packages"><h2>' + LABELS.copy_block_packages + '</h2>';
        if (pkg.intro) html += '<p class="mc-copy-block-intro">' + h(pkg.intro) + '</p>';
        if (pkgItems.length) {
          html += '<div class="mc-copy-cards">';
          pkgItems.forEach(function(item) {
            html += '<div class="mc-copy-card">' +
              '<p class="mc-copy-card-name">' + h(item.name || '') + '</p>' +
              (item.price ? '<p class="mc-copy-card-price">' + h(item.price) + '</p>' : '') +
              (item.forWhom ? '<p class="mc-copy-card-desc">' + h(item.forWhom) + '</p>' : '') +
              '</div>';
          });
          html += '</div>';
        }
        if (pkg.ctaPrimary) html += '<a class="mc-copy-block-cta">' + h(pkg.ctaPrimary) + '</a>';
        html += '</section>';
      }
      // Audit pitch
      var ap = copy.auditPitch || {};
      if (ap.headline || ap.intro) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="auditPitch"><h2>' + LABELS.copy_block_audit_pitch + '</h2>';
        if (ap.headline) html += '<p class="mc-copy-pitch-headline">' + h(ap.headline) + '</p>';
        if (ap.intro) html += '<p class="mc-copy-block-intro">' + h(ap.intro) + '</p>';
        if (Array.isArray(ap.youGet) && ap.youGet.length) {
          html += '<ul class="mc-copy-pitch-list">';
          ap.youGet.forEach(function(line) { html += '<li>' + h(line) + '</li>'; });
          html += '</ul>';
        }
        if (ap.noStrings) html += '<p class="mc-copy-pitch-no-strings">' + h(ap.noStrings) + '</p>';
        if (ap.ctaPrimary) html += '<a class="mc-copy-block-cta">' + h(ap.ctaPrimary) + '</a>';
        html += '</section>';
      }
      // Install pitch
      var ip = copy.installPitch || {};
      var ipSteps = Array.isArray(ip.steps) ? ip.steps : [];
      if (ip.headline || ip.intro || ipSteps.length) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="installPitch"><h2>' + LABELS.copy_block_install_pitch + '</h2>';
        if (ip.headline) html += '<p class="mc-copy-pitch-headline">' + h(ip.headline) + '</p>';
        if (ip.intro) html += '<p class="mc-copy-block-intro">' + h(ip.intro) + '</p>';
        if (ipSteps.length) {
          html += '<div class="mc-copy-steps">';
          ipSteps.forEach(function(s) {
            html += '<div class="mc-copy-step"><div><strong>' + h(s.name || '') + '</strong>' + (s.description ? ' — ' + h(s.description) : '') + '</div></div>';
          });
          html += '</div>';
        }
        if (ip.envs) html += '<p class="mc-copy-pitch-envs">' + h(ip.envs) + '</p>';
        if (ip.ctaPrimary) html += '<a class="mc-copy-block-cta">' + h(ip.ctaPrimary) + '</a>';
        html += '</section>';
      }
      // FAQ
      var fq = copy.faq || {};
      var faq = Array.isArray(fq.items) ? fq.items : [];
      if (faq.length) {
        html += '<section class="ui-card ui-card--copy" data-copy-block="faq"><h2>' + LABELS.copy_block_faq + '</h2>';
        faq.forEach(function(f) {
          html += '<div class="mc-copy-faq-item">' +
            '<div class="mc-copy-faq-question">' + h(f.question) + '</div>' +
            '<div class="mc-copy-faq-answer">' + h(f.answer) + '</div>' +
            '</div>';
        });
        html += '</section>';
      }

      html += '</div>';   // .mc-copy-doc
      html += '</div>';   // .mc-copy-page
      copyRoot.innerHTML = html;
      _wireCopyClicks();
    }

    // ---- Copy view — panel list (6 block names) + detail (block reasoning) ----
    function renderCopyList() {
      if (!panelBody) return;
      window.__shell._setView('list');
      if (panelHeader) panelHeader.style.display = 'none';
      if (panelFilterArea) panelFilterArea.style.display = 'none';
      window.__shell.clearDropShadow();
      var copy = (_activeVariant && _activeVariant.copy) || {};
      var html = '<div class="shell-group" data-group="copy-blocks">' +
        '<h4 class="shell-group-header">' + LABELS.copy_blocks_header + '</h4>' +
        '<div class="shell-list">';
      var n = 0;
      COPY_BLOCKS.forEach(function(b) {
        if (!copy[b.key]) return;
        n++;
        html += '<div class="shell-item" data-copy-block="' + b.key + '">' +
          '<div class="shell-item__row">' +
            '<span class="shell-item__n">#' + n + '</span>' +
          '</div>' +
          '<h4 class="shell-item__title">' + _copyBlockLabel(b.key) + '</h4>' +
        '</div>';
      });
      html += '</div></div>';
      panelBody.innerHTML = html;
    }

    function renderCopyDetail(blockKey) {
      if (!panelBody) return;
      window.__shell._setView('detail');
      if (panelHeader) panelHeader.style.display = '';
      if (panelFilterArea) panelFilterArea.style.display = 'none';
      var copy = (_activeVariant && _activeVariant.copy) || {};
      var block = copy[blockKey] || {};
      var reasoning = block.reasoning || LABELS.no_reasoning_placeholder;
      var html = '<h3 class="shell-detail__title">' + _copyBlockLabel(blockKey) + '</h3>';
      html += '<h4 class="shell-detail__label" style="margin-top:18px;">' + LABELS.reasoning_header + '</h4>';
      html += '<div class="shell-detail__blocks">' +
        '<div class="shell-detail__block"><p class="shell-detail__text">' + reasoning + '</p></div>' +
        '</div>';
      panelBody.innerHTML = html;
    }

    var _currentCopyBlock = null;
    function _wireCopyClicks() {
      var copyRoot = document.getElementById('copyRoot');
      if (!copyRoot || copyRoot.__wired) return;
      copyRoot.__wired = true;
      copyRoot.addEventListener('click', function(e) {
        var block = e.target.closest('[data-copy-block]');
        if (!block) return;
        var key = block.getAttribute('data-copy-block');
        // Toggle: second click on the already-open block returns to the list.
        if (window.__shell._getView() === 'detail' && key === _currentCopyBlock) {
          _currentCopyBlock = null;
          window.__shell.clearDropShadow();
          renderCopyList();
          return;
        }
        window.__shell.openPanel();
        window.__shell.applyDropShadow(block);
        _currentCopyBlock = key;
        renderCopyDetail(key);
      });
    }

    // ---- View toggle: swap between canvas and copy views ----
    var _activeView = 'canvas';
    function setActiveView(view) {
      _activeView = (view === 'copy') ? 'copy' : 'canvas';
      document.body.classList.toggle('mc-view-copy', _activeView === 'copy');
      var canvasBtn = document.getElementById('mcViewCanvasBtn');
      var copyBtn = document.getElementById('mcViewCopyBtn');
      if (canvasBtn) canvasBtn.classList.toggle('is-active', _activeView === 'canvas');
      if (copyBtn) copyBtn.classList.toggle('is-active', _activeView === 'copy');
      if (_activeView === 'copy') {
        renderCopy();
        renderCopyList();
      } else {
        renderList();
      }
    }

    // ---- _renderCanvasCell() — returns HTML for one canvas cell ----
    // Dispatch is structure-based (no `type` field required):
    //   dimensions[]  → pillar rendering
    //   items[] with items[0].classification  → Capabilities inner-block rendering
    //   items[] with items[0].weighting       → Desired Outcomes inner-block rendering
    //   else → plain curated (covers both decision cells and plain curated cells)
    function _renderCanvasCell(cell) {
      if (cell.dimensions && cell.dimensions.length) {
        return _renderPillarCell(cell);
      } else if (cell.items && cell.items.length) {
        var firstItem = cell.items[0];
        if (firstItem && firstItem.classification !== undefined) {
          return _renderCapabilitiesCell(cell);
        }
        if (firstItem && firstItem.weighting !== undefined) {
          return _renderOutcomesCell(cell);
        }
        // items present but no classification/weighting — fall through to curated
        return _renderCuratedCell(cell);
      } else {
        // decision, plain curated, or any cell without structural discriminators
        return _renderCuratedCell(cell);
      }
    }

    // ---- HTML escape helper ----
    function _escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ---- Evidence bullet helper (mirrors wireframing metaSeg pattern) ----
    // Entry: { label: '{Label:}', content: '{placeholder}' | 'real value' }
    // Placeholder mode (both braced): {**Label:** content text} — single outer brace
    // Real data mode: **Label:** value — no braces
    // Evidence row — renders one labeled key-value as a flat <div> (matches
    // project-plan's metaSeg pattern; no <li>/<ul>). Confidence is no longer
    // emitted here — it's pinned to the card bottom via _renderConfidenceRow.
    // The confidence-special branch below stays only as a fallback for any
    // caller that doesn't pre-filter confidence entries; rendered as a
    // <div class="mc-proof"> for visual parity with the bottom-pinned row.
    function _evidenceBullet(entry, rec) {
      if (!entry || typeof entry !== 'object') return '';
      var rawLabel = entry.label || '';
      var rawContent = entry.content || '';
      var lbl = (rawLabel.startsWith('{') && rawLabel.endsWith('}'))
        ? rawLabel.slice(1, -1)
        : rawLabel;
      var v = String(rawContent);
      var isConf = entry.role === 'confidence';
      if (isConf) {
        // Tier badge + text come from LABELS[conf_{rec.confidence}] via _confBadge.
        // Content is the basis prose only (no tier prefix, no em-dash split).
        var badge = _confBadge(rec && rec.confidence);
        var isPlaceholder = v.startsWith('{') && v.endsWith('}');
        var basis = isPlaceholder ? v.slice(1, -1) : v;
        var basisHtml = basis
          ? (isPlaceholder ? ' \u2014 {' + _escapeHtml(basis) + '}' : ' \u2014 ' + _escapeHtml(basis))
          : '';
        return '<div class="mc-proof">' +
          '<strong>' + LABELS.confidence_label + '</strong> ' +
          (badge || '') +
          basisHtml +
          '</div>';
      }
      if (v.startsWith('{') && v.endsWith('}')) {
        // Placeholder mode — keep label + content each individually braced.
        return '<div><strong>' + _escapeHtml(rawLabel) + '</strong> ' + _escapeHtml(rawContent) + '</div>';
      }
      return '<div><strong>' + _escapeHtml(lbl) + '</strong> ' + _escapeHtml(v) + '</div>';
    }

    // ---- Evidence rows (shared) — flat <div> children, no <ul>/<li> ----
    // Matches project-plan's stacked-row convention (kvSeg/metaSeg).
    // opts.skipConfidence: drops Confidence entries from the row list (canvas
    // pins those to the bottom via _renderConfidenceRow + .ui-card__meta).
    function _renderEvidenceBullets(evidenceArr, rec, opts) {
      if (!evidenceArr || !evidenceArr.length) return '';
      var skipConf = opts && opts.skipConfidence;
      var filtered = skipConf
        ? evidenceArr.filter(function(ev) {
            return ev.role !== 'confidence';
          })
        : evidenceArr;
      if (!filtered.length) return '';
      var rows = filtered.map(function(ev) {
        return _evidenceBullet(ev, rec);
      });
      return '<div class="mc-evidence">' + rows.join('') + '</div>';
    }

    // ---- Extract confidence entry and render it as a bottom-pinned meta row
    // (shared convention with project-plan's .ui-card__meta). Emits a flat
    // label + tier pill + optional basis, with a border-top divider. ----
    function _renderConfidenceRow(evidenceArr, rec) {
      if (!evidenceArr || !evidenceArr.length) return '';
      var confEv = evidenceArr.find(function(ev) {
        return ev.role === 'confidence';
      });
      if (!confEv) return '';
      var rawLabel = confEv.label || LABELS.confidence_label;
      // Badge text + color come from _confBadge(rec.confidence) via LABELS.
      // Card shows only label + pill; basis prose moves to side panel via renderDetail.
      var badge = _confBadge(rec && rec.confidence);
      if (!badge) return '';
      return '<div class="ui-card__meta">' +
        '<span class="ui-card__meta-label">' + _escapeHtml(rawLabel) + '</span>' +
        badge +
        '</div>';
    }

    // ---- Confidence proof bullet using cell.rec.confidence ----
    function _renderConfidenceLi(rec) {
      if (!rec || !rec.confidence) return '';
      var badge = _confBadge(rec.confidence);
      var basisEv = (rec.evidence || []).find(function(ev) {
        return ev.role === 'confidence';
      });
      var basis = basisEv ? basisEv.content : '';
      return '<li class="mc-proof"><strong>' + LABELS.confidence_label + '</strong> ' + badge + (basis ? ' — ' + basis : '') + '</li>';
    }

    // ---- Standard decision/curated cell ----
    function _renderCuratedCell(cell) {
      var rec = cell.rec || {};

      // Decision cell branch: REC + alternatives each wrapped in a variant panel.
      // Chip switcher lives only in the left panel detail view — canvas swaps
      // content silently when a panel chip is clicked.
      if (cell.alternatives && cell.alternatives.length) {
        var variantsHtml = '';
        variantsHtml += '<div class="shell-variant-panel is-active" data-variant-idx="0">' +
          (rec.decision ? '<p class="mc-decision">' + rec.decision + '</p>' : '') +
          _renderEvidenceBullets(rec.evidence, rec, { skipConfidence: true }) +
          _renderConfidenceRow(rec.evidence, rec) +
          '</div>';
        cell.alternatives.forEach(function(alt, i) {
          variantsHtml += '<div class="shell-variant-panel" data-variant-idx="' + (i + 1) + '">' +
            (alt.decision ? '<p class="mc-decision">' + alt.decision + '</p>' : '') +
            _renderEvidenceBullets(alt.evidence, alt, { skipConfidence: true }) +
            _renderConfidenceRow(alt.evidence, alt) +
            '</div>';
        });
        return '<div class="ui-card' + (cell.tbd ? ' ui-card--tbd' : '') + '" data-cell-id="' + cell.id + '">' +
          _cellHeader(cell) +
          variantsHtml +
          '</div>';
      }

      var evidenceHtml = _renderEvidenceBullets(rec.evidence, rec, { skipConfidence: true });
      var confidenceRowHtml = _renderConfidenceRow(rec.evidence, rec);

      // Alternatives cluster blocks (A1) — rendered after evidence bullets
      var clustersHtml = '';
      if (cell.clusters && cell.clusters.length) {
        clustersHtml = cell.clusters.map(function(cluster) {
          var membersHtml = (cluster.members || []).map(function(m) {
            return '<li>' + _escapeHtml(m) + '</li>';
          }).join('');
          return '<div class="mc-dim-block">' +
            '<div class="mc-dim-header">' +
              '<span class="mc-dim-name">' + _escapeHtml(cluster.label || '') + '</span>' +
            '</div>' +
            '<ul class="mc-bullets">' + membersHtml + '</ul>' +
            '</div>';
        }).join('');
      }

      return '<div class="ui-card' + (cell.tbd ? ' ui-card--tbd' : '') + '" data-cell-id="' + cell.id + '">' +
        _cellHeader(cell) +
        (rec.decision ? '<p class="mc-decision">' + rec.decision + '</p>' : '') +
        clustersHtml +
        evidenceHtml +
        confidenceRowHtml +
        '</div>';
    }

    // ---- Capabilities cell (curated with items + classification badges) ----
    function _renderCapabilitiesCell(cell) {
      var rec = cell.rec || {};
      var evidenceHtml = _renderEvidenceBullets(rec.evidence, rec);

      var itemsHtml = (cell.items || []).map(function(item) {
        var classBadge = CLASS_BADGE[item.classification] || {};
        var confBadge = CONF_BADGE[item.confidence] || {};
        var clsSpan = classBadge.cls
          ? '<span class="mc-badge ' + classBadge.cls + '">' + _badgeLabel(classBadge) + '</span>'
          : '';
        var confSpan = confBadge.cls
          ? '<span class="mc-badge ' + confBadge.cls + '">' + _badgeLabel(confBadge) + '</span>'
          : '';
        var itemEvidenceHtml = '';
        if (item.evidence && item.evidence.length) {
          var itemRows = item.evidence.map(function(ev) {
            return _evidenceBullet(ev, item);
          }).join('');
          itemEvidenceHtml = '<div class="mc-evidence">' + itemRows + '</div>';
        }
        return '<div class="mc-dim-block">' +
          '<div class="mc-dim-name">' + (item.name || '') + '</div>' +
          '<div class="mc-dim-badges">' + clsSpan + confSpan + '</div>' +
          (item.decision ? '<p class="mc-decision">' + item.decision + '</p>' : '') +
          itemEvidenceHtml +
          '</div>';
      }).join('');

      return '<div class="ui-card' + (cell.tbd ? ' ui-card--tbd' : '') + '" data-cell-id="' + cell.id + '">' +
        _cellHeader(cell) +
        (rec.decision ? '<p class="mc-decision">' + rec.decision + '</p>' : '') +
        evidenceHtml +
        itemsHtml +
        '</div>';
    }

    // ---- Desired Outcomes cell (curated with items + weighting badges) ----
    function _renderOutcomesCell(cell) {
      var rec = cell.rec || {};
      // Sort items in hierarchy order
      var items = (cell.items || []).slice().sort(function(a, b) {
        var ai = WEIGHT_ORDER.indexOf(a.weighting);
        var bi = WEIGHT_ORDER.indexOf(b.weighting);
        if (ai === -1) ai = WEIGHT_ORDER.length;
        if (bi === -1) bi = WEIGHT_ORDER.length;
        return ai - bi;
      });

      // Split rec.evidence into non-confidence (rendered first) and confidence (rendered last)
      var nonConfEvidence = [];
      var confEvidence = [];
      (rec.evidence || []).forEach(function(ev) {
        if (ev.role === 'confidence') confEvidence.push(ev);
        else nonConfEvidence.push(ev);
      });

      var nonConfLi = nonConfEvidence.map(function(ev) {
        return _evidenceBullet(ev, rec);
      }).join('');

      // Render outcome items as bullets (structural, not evidence entries).
      // Each item shows its weighting badge only. Confidence for outcomes
      // lives on the pillars (Row 3), where proof backs the outcome claim —
      // duplicating it per outcome adds noise without new signal.
      var outcomeItemsHtml = items.map(function(item) {
        var wb = WEIGHT_BADGE[item.weighting] || {};
        var wSpan = wb.cls
          ? '<span class="mc-badge ' + wb.cls + '">' + _badgeLabel(wb) + '</span>'
          : '';
        var firstEv = item.evidence && item.evidence.length ? item.evidence[0].content : '';
        return '<div class="mc-outcome">' +
          '<div class="mc-outcome-name"><strong>' + (item.name || '') + '</strong></div>' +
          '<div class="mc-outcome-weighting">' + wSpan + '</div>' +
          '<div class="mc-outcome-text">' + firstEv + '</div>' +
          '</div>';
      }).join('');

      // Confidence goes LAST — after outcome items
      var confRows = confEvidence.map(function(ev) {
        return _evidenceBullet(ev, rec);
      }).join('');

      var rowsHtml = nonConfLi + outcomeItemsHtml + confRows;

      var evidenceHtml = rowsHtml
        ? '<div class="mc-evidence">' + rowsHtml + '</div>'
        : '';

      return '<div class="ui-card' + (cell.tbd ? ' ui-card--tbd' : '') + '" data-cell-id="' + cell.id + '">' +
        _cellHeader(cell) +
        (rec.decision ? '<p class="mc-decision">' + rec.decision + '</p>' : '') +
        evidenceHtml +
        '</div>';
    }

    // ---- Pillar cell ----
    function _renderPillarCell(cell) {
      var rec = cell.rec || {};
      // Evidence bullets: In short / Mechanism / Value (confidence pinned to card bottom)
      var evidenceHtml = _renderEvidenceBullets(rec.evidence, rec, { skipConfidence: true });
      var confidenceRowHtml = _renderConfidenceRow(rec.evidence, rec);

      var dimsHtml = (cell.dimensions || []).map(function(dim) {
        var badgeCls = (dim.badge && dim.badge.value === 'confirmed') ? 'mc-badge--green'
          : (dim.badge && dim.badge.value === 'no_evidence') ? 'mc-badge--red'
          : 'mc-badge--yellow';
        var proofs = dim.proofs || [];
        var proofRows;
        // No evidence: empty proofs array → render mc-dim-empty as a labeled element
        // (Validation proposal: {emptyDescription}) — parallel to evidence bullets
        if (dim.badge && dim.badge.value === 'no_evidence' && proofs.length === 0) {
          var emptyDesc = dim.emptyDescription || LABELS.empty_dim_description;
          proofRows = '<div class="mc-dim-empty"><strong>' + LABELS.md_validation_proposal_label + '</strong> ' + emptyDesc + '</div>';
        } else {
          proofRows = proofs.map(function(p) {
            return '<div class="mc-proof">' + p.text + '</div>';
          }).join('');
        }
        return '<div class="mc-dim-block">' +
          '<div class="mc-dim-name">' + _escapeHtml(dim.name || '') + '</div>' +
          '<div class="mc-dim-badges"><span class="mc-badge ' + badgeCls + '">' + _escapeHtml(dim.badge && dim.badge.label ? dim.badge.label : '') + '</span></div>' +
          proofRows +
          '</div>';
      }).join('');

      return '<div class="ui-card ui-card--pillar' + (cell.tbd ? ' ui-card--tbd' : '') + '" data-cell-id="' + cell.id + '">' +
        _cellHeader(cell) +
        evidenceHtml +
        dimsHtml +
        confidenceRowHtml +
        '</div>';
    }

    // ---- renderList ----
    function renderList() {
      window.__shell._setView('list');
      if (panelHeader) panelHeader.style.display = 'none';
      if (panelFilterArea) panelFilterArea.style.display = '';
      window.__shell._renderFilterArea();
      window.__shell.clearDropShadow();

      var cells = (_activeVariant && _activeVariant.cells) ? _activeVariant.cells : [];

      // Group by row
      var groups = {};
      ROW_ORDER.forEach(function(row) { groups[row] = []; });
      cells.forEach(function(cell) {
        if (groups[cell.row]) groups[cell.row].push(cell);
        else { groups[cell.row] = [cell]; }
      });

      var html = '';
      var n = 0;
      ROW_ORDER.forEach(function(row) {
        var rowCells = groups[row];
        if (!rowCells || rowCells.length === 0) return;
        var visibleCells = rowCells.filter(function(cell) { return !cell.tbd; });
        if (visibleCells.length === 0) return;
        var itemsHTML = visibleCells.map(function(cell) {
          n++;
          return '<div class="shell-item" data-cell-id="' + cell.id + '">' +
            '<div class="shell-item__row">' +
              '<span class="shell-item__n">#' + n + '</span>' +
              '<span class="shell-item__labels">' + _confBadge(cell.rec && cell.rec.confidence) + '</span>' +
            '</div>' +
            '<h4 class="shell-item__title">' + (cell.name || cell.id) + '</h4>' +
          '</div>';
        }).join('');
        html += '<div class="shell-group" data-group="' + row + '">' +
          '<h4 class="shell-group-header">' + _rowLabel(row) + '</h4>' +
          '<div class="shell-list">' + itemsHTML + '</div>' +
          '</div>';
      });

      if (panelBody) panelBody.innerHTML = html;

      // Wire panel item clicks
      _wirePanelItemClicks();

      // Apply current filter state
      var state = {};
      ROW_ORDER.forEach(function(row) { /* no-op — filter fires via onFilterChange */ });
      // Manually apply current filter state without re-triggering
      var activeState = {};
      ['row','confidence','flag'].forEach(function(axis) {
        activeState[axis] = [];
      });
      // We need to read current chip state. The chips are in the DOM — read them.
      if (panelFilterArea) {
        panelFilterArea.querySelectorAll('.shell-chip.is-active').forEach(function(chip) {
          var axis = chip.getAttribute('data-filter-axis');
          var val  = chip.getAttribute('data-filter');
          if (axis && val && val !== 'all') {
            if (!activeState[axis]) activeState[axis] = [];
            activeState[axis].push(val);
          }
        });
      }
      _applyItemFilter(activeState);
    }

    // ---- Panel item click handler ----
    function _wirePanelItemClicks() {
      if (!panelBody) return;
      panelBody.addEventListener('click', function(e) {
        // Variant chip click (decision-cell detail view) — swap active variant
        // in both the panel detail and the matching canvas cell.
        var chip = e.target.closest('.shell-chip[data-variant-idx]');
        if (chip) {
          var idx = chip.getAttribute('data-variant-idx');
          var variantsRow = chip.parentElement;
          if (variantsRow) {
            variantsRow.querySelectorAll('.shell-chip').forEach(function(c) {
              var active = (c === chip);
              c.classList.toggle('is-active', active);
              if (c.hasAttribute('aria-selected')) {
                c.setAttribute('aria-selected', active ? 'true' : 'false');
              }
            });
          }
          // Swap active panel in panelBody — limit scope to siblings of variantsRow
          var container = variantsRow ? variantsRow.parentElement : panelBody;
          container.querySelectorAll(':scope > .shell-variant-panel').forEach(function(p) {
            p.classList.toggle('is-active', p.getAttribute('data-variant-idx') === idx);
          });
          // Mirror to the canvas cell
          if (_currentDetailId) {
            var canvasCell = document.querySelector('#canvasRoot [data-cell-id="' + _currentDetailId + '"]');
            if (canvasCell) {
              canvasCell.querySelectorAll(':scope > .shell-variant-panel').forEach(function(p) {
                p.classList.toggle('is-active', p.getAttribute('data-variant-idx') === idx);
              });
            }
          }
          return;
        }
        // Copy-view list item click — open the block's reasoning
        var copyItem = e.target.closest('.shell-item[data-copy-block]');
        if (copyItem) {
          var copyKey = copyItem.getAttribute('data-copy-block');
          renderCopyDetail(copyKey);
          return;
        }
        var item = e.target.closest('.shell-item');
        if (item) {
          var cellId2 = item.getAttribute('data-cell-id');
          if (!cellId2) return;
          // Capture nav list from current visible items
          var allItems = Array.from(panelBody.querySelectorAll('.shell-item:not(.is-hidden)'));
          var navList  = allItems.map(function(el) { return { cellId: el.getAttribute('data-cell-id') }; });
          var navIdx   = navList.findIndex(function(x) { return x.cellId === cellId2; });
          window.__shell._setNavList(navList, navIdx);
          // Scroll matching canvas cell into view and apply drop-shadow
          var canvasEl = document.querySelector('[data-cell-id="' + cellId2 + '"]');
          if (canvasEl) {
            window.__shell.applyDropShadow(canvasEl);
            canvasEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          renderDetail(cellId2);
        }
      });
    }

    // ---- Build the panel-only Pewność / Confidence section ----
    // Card shows label + pill only (via _renderConfidenceRow); panel repeats
    // label + pill AND carries the full basis text. Section renders only when
    // cell/variant has an evidence entry with role === 'confidence'.
    function _renderConfidenceDetailBlock(rec, evidence) {
      if (!rec || !rec.confidence) return '';
      var confEv = (evidence || []).find(function(ev) { return ev.role === 'confidence'; });
      if (!confEv) return '';
      // content carries the basis prose directly (no em-dash split, no tier prefix).
      // Tier badge text + color come from _confBadge(rec.confidence) via LABELS.
      var v = String(confEv.content || '');
      var isPh = v.startsWith('{') && v.endsWith('}');
      var basis = isPh ? v.slice(1, -1) : v;
      var label = (confEv.label || LABELS.confidence_label).replace(/^\{|\}$/g, '').replace(/:$/, '');
      var badge = _confBadge(rec.confidence);
      return '<h4 class="shell-detail__label" style="margin-top:18px;">' + _escapeHtml(label) + '</h4>' +
        '<div class="shell-detail__blocks">' +
          '<div class="shell-detail__block">' +
            badge +
            (basis ? '<div class="shell-detail__text" style="margin-top:8px;">' + _escapeHtml(basis) + '</div>' : '') +
          '</div>' +
        '</div>';
    }

    // ---- renderDetail ----
    function renderDetail(cellId) {
      window.__shell._setView('detail');
      if (panelHeader) panelHeader.style.display = '';
      if (panelFilterArea) panelFilterArea.style.display = 'none';
      window.__shell._updateNavCounter();

      var cell = _findCell(cellId);
      if (!cell || !panelBody) return;

      var html = '';

      // Title
      html += '<h3 class="shell-detail__title">' + (cell.name || cell.id) + '</h3>';

      // Decision cells: chip row + variant panels (REC + each alternative).
      // Clicking a chip swaps which variant is active in both the panel and
      // the matching canvas cell. Reasoning is rendered per-variant inside
      // the panel, so the bottom `cell.reasoning` block is also skipped.
      var isDecisionCell = !!(cell.alternatives && cell.alternatives.length);
      if (isDecisionCell) {
        // Strip trailing period from decision for display in chip
        var _stripPeriod = function(s) {
          return (s || '').replace(/\.\s*$/, '');
        };
        var recTitle = _stripPeriod((cell.rec && cell.rec.decision) || (cell.rec && cell.rec.label) || LABELS.variant_recommended);
        var chips = '<h4 class="shell-detail__label" style="margin-top:18px;">' + LABELS.variants_header + '</h4>' +
          '<div class="shell-variants shell-variants--list" role="tablist">' +
          '<button type="button" class="shell-chip is-active" data-variant-idx="0" role="tab" aria-selected="true">' +
            '<span class="shell-chip__indicator" aria-hidden="true"></span>' +
            '<span class="shell-chip__label">' +
              '<span class="shell-chip__title">' + _escapeHtml(recTitle) + '</span>' +
              '<span class="shell-chip__badge--rec">' + LABELS.variant_recommended + '</span>' +
            '</span>' +
          '</button>';
        cell.alternatives.forEach(function(alt, i) {
          var altTitle = _stripPeriod(alt.decision || alt.label || LABELS.variant_alternative);
          chips += '<button type="button" class="shell-chip" data-variant-idx="' + (i + 1) + '" role="tab" aria-selected="false">' +
            '<span class="shell-chip__indicator" aria-hidden="true"></span>' +
            '<span class="shell-chip__label">' +
              '<span class="shell-chip__title">' + _escapeHtml(altTitle) + '</span>' +
            '</span>' +
          '</button>';
        });
        chips += '</div>';
        html += chips;

        // REC variant panel (index 0) — reasoning only; decision + evidence
        // live on the canvas cell (no duplication).
        html += '<div class="shell-variant-panel is-active" data-variant-idx="0">';
        var recHasReasoning = cell.reasoning && (
          (cell.reasoning.why && cell.reasoning.why.length) ||
          (cell.reasoning.when_differently && cell.reasoning.when_differently.length)
        );
        if (recHasReasoning) {
          html += '<h4 class="shell-detail__label" style="margin-top:18px;">' + LABELS.reasoning_header + '</h4>';
          html += '<div class="shell-detail__blocks">';
          if (cell.reasoning.why && cell.reasoning.why.length) {
            html += '<div class="shell-detail__block">';
            html += '<h4 class="shell-detail__label">' + LABELS.why_we_recommend + '</h4>';
            html += '<ul style="margin:0;padding-left:16px;">';
            cell.reasoning.why.forEach(function(b) { html += '<li class="shell-detail__text">' + b + '</li>'; });
            html += '</ul></div>';
          }
          if (cell.reasoning.when_differently && cell.reasoning.when_differently.length) {
            html += '<div class="shell-detail__block">';
            html += '<h4 class="shell-detail__label">' + LABELS.when_to_choose_differently + '</h4>';
            html += '<ul style="margin:0;padding-left:16px;">';
            cell.reasoning.when_differently.forEach(function(b) { html += '<li class="shell-detail__text">' + b + '</li>'; });
            html += '</ul></div>';
          }
          html += '</div>'; // .shell-detail__blocks (reasoning)
        }
        // Pewność section at end of REC variant panel
        html += _renderConfidenceDetailBlock(cell.rec, cell.rec && cell.rec.evidence);
        html += '</div>'; // .shell-variant-panel (REC)

        // Alternative variant panels (index 1..N) — reasoning only
        cell.alternatives.forEach(function(alt, i) {
          html += '<div class="shell-variant-panel" data-variant-idx="' + (i + 1) + '">';
          var altHasReasoning = alt.reasoning && (
            (alt.reasoning.why_this && alt.reasoning.why_this.length) ||
            (alt.reasoning.when_to_choose && alt.reasoning.when_to_choose.length)
          );
          if (altHasReasoning) {
            html += '<h4 class="shell-detail__label" style="margin-top:18px;">' + LABELS.reasoning_header + '</h4>';
            html += '<div class="shell-detail__blocks">';
            if (alt.reasoning.why_this && alt.reasoning.why_this.length) {
              html += '<div class="shell-detail__block">';
              html += '<h4 class="shell-detail__label">' + LABELS.why_this + '</h4>';
              html += '<ul style="margin:0;padding-left:16px;">';
              alt.reasoning.why_this.forEach(function(b) { html += '<li class="shell-detail__text">' + b + '</li>'; });
              html += '</ul></div>';
            }
            if (alt.reasoning.when_to_choose && alt.reasoning.when_to_choose.length) {
              html += '<div class="shell-detail__block">';
              html += '<h4 class="shell-detail__label">' + LABELS.when_this_might_be_fine + '</h4>';
              html += '<ul style="margin:0;padding-left:16px;">';
              alt.reasoning.when_to_choose.forEach(function(b) { html += '<li class="shell-detail__text">' + b + '</li>'; });
              html += '</ul></div>';
            }
            html += '</div>'; // .shell-detail__blocks (reasoning)
          }
          // Pewność section at end of alternative variant panel
          html += _renderConfidenceDetailBlock(alt, alt && alt.evidence);
          html += '</div>'; // .shell-variant-panel (alt)
        });
      }

      // Non-decision cells: panel = reasoning only (+ any panel-only enrichment
      // per cell type). Decision text, evidence, pillar dimensions, and per-item
      // decision/evidence all live on the canvas and are not repeated here.
      //
      // Panel-only enrichment rendered below:
      //   - Capabilities items → value chain (Feature/Benefit/Outcome).
      // Everything else is canvas-owned.
      if (!isDecisionCell && cell.items && cell.items.length) {
        var itemsWithValueChain = cell.items.filter(function(it) { return !!it.valueChain; });
        if (itemsWithValueChain.length) {
          html += '<h4 class="shell-detail__label" style="margin-top:18px;">' + LABELS.value_chain_header + '</h4>';
          html += '<div class="shell-detail__blocks">';
          itemsWithValueChain.forEach(function(item) {
            var vc = item.valueChain;
            html += '<div class="shell-detail__block">';
            html += '<div style="margin-bottom:6px;"><strong style="font-size:14px;color:var(--wf-text);">' +
              _escapeHtml(item.name || '') + '</strong></div>';
            html += '<div class="mc-value-chain-group">';
            html += '<div><strong>' + LABELS.value_chain_feature + '</strong> ' + _escapeHtml(vc.feature || '') + '</div>';
            html += '<div><strong>' + LABELS.value_chain_benefit + '</strong> ' + _escapeHtml(vc.benefit || '') + '</div>';
            html += '<div><strong>' + LABELS.value_chain_outcome + '</strong> ' + _escapeHtml(vc.outcome || '') + '</div>';
            html += '</div>';
            html += '</div>';
          });
          html += '</div>';
        }
      }

      // Reasoning — decision cells render reasoning per-variant inside the
      // variant switcher above, so skip this block for them.
      if (!isDecisionCell && cell.reasoning) {
        var r = cell.reasoning;
        html += '<h4 class="shell-detail__label" style="margin-top:18px;">' + LABELS.reasoning_header + '</h4>';
        html += '<div class="shell-detail__blocks">';
        if (r.why && r.why.length) {
          html += '<div class="shell-detail__block">';
          html += '<h4 class="shell-detail__label">' + LABELS.why_we_recommend + '</h4>';
          html += '<ul style="margin:0;padding-left:16px;">';
          r.why.forEach(function(b) { html += '<li class="shell-detail__text">' + b + '</li>'; });
          html += '</ul></div>';
        }
        if (r.when_differently && r.when_differently.length) {
          html += '<div class="shell-detail__block">';
          html += '<h4 class="shell-detail__label">' + LABELS.when_to_choose_differently + '</h4>';
          html += '<ul style="margin:0;padding-left:16px;">';
          r.when_differently.forEach(function(b) { html += '<li class="shell-detail__text">' + b + '</li>'; });
          html += '</ul></div>';
        }
        if (r.included && r.included.length) {
          html += '<div class="shell-detail__block">';
          html += '<h4 class="shell-detail__label">' + LABELS.included_header + '</h4>';
          html += '<ul style="margin:0;padding-left:16px;">';
          r.included.forEach(function(b) { html += '<li class="shell-detail__text">' + b + '</li>'; });
          html += '</ul></div>';
        }
        if (r.left_out && r.left_out.length) {
          html += '<div class="shell-detail__block">';
          html += '<h4 class="shell-detail__label">' + LABELS.left_out_header + '</h4>';
          html += '<ul style="margin:0;padding-left:16px;">';
          r.left_out.forEach(function(b) { html += '<li class="shell-detail__text">' + b + '</li>'; });
          html += '</ul></div>';
        }
        html += '</div>'; // .shell-detail__blocks
      }

      // Pewność section at end of non-decision cell panel
      if (!isDecisionCell) {
        html += _renderConfidenceDetailBlock(cell.rec, cell.rec && cell.rec.evidence);
      }

      panelBody.innerHTML = html;
    }

    // ---- Cell click handlers (canvas → panel) — event delegation on #canvasRoot ----
    // Single delegated listener survives renderCanvas() re-renders; no per-element binding needed.
    // Second click on the currently-active card closes the detail view (toggle behavior).
    var _currentDetailId = null; // track which cell is currently open in detail view

    function _wireCanvasClicks() {
      var canvasRoot = document.getElementById('canvasRoot');
      if (!canvasRoot) return;
      canvasRoot.addEventListener('click', function(e) {
        var cellEl = e.target.closest('.ui-card');
        if (!cellEl) return;
        var cellId = cellEl.getAttribute('data-cell-id');
        if (!cellId) return;
        // Toggle behavior — second click on currently-active card closes detail
        if (window.__shell._getView() === 'detail' && cellId === _currentDetailId) {
          _currentDetailId = null;
          window.__shell.clearDropShadow();
          renderList();
          return;
        }
        window.__shell.openPanel();
        // Capture nav list from all current panel items
        var allItems = Array.from(
          (window.__shell._panelBody || document).querySelectorAll('.shell-item')
        );
        var navList = allItems.map(function(el) { return { cellId: el.getAttribute('data-cell-id') }; });
        var navIdx = navList.findIndex(function(x) { return x.cellId === cellId; });
        window.__shell._setNavList(navList, navIdx);
        window.__shell.applyDropShadow(cellEl);
        window.__shell.scrollItemIntoView(cellId);
        _currentDetailId = cellId;
        renderDetail(cellId);
      });
    }

    // ---- Keyboard/nav detail trigger (called by Block 1 nav buttons) ----
    window.__shell._triggerDetailById = function(cellId) {
      var canvasEl = document.querySelector('[data-cell-id="' + cellId + '"]');
      if (canvasEl) {
        window.__shell.applyDropShadow(canvasEl);
        canvasEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      renderDetail(cellId);
    };

    // ---- MD formatter ----
    // Helper: format one rec.evidence / alt.evidence entry as a markdown bullet.
    // Confidence entries get the tier label prepended from LABELS.conf_{tier},
    // since flat MD has no badge affordance.
    function _formatEvidenceBullet(ev, parent, indent) {
      var rawLabel = ev.label || '';
      var rawContent = ev.content || '';
      var lbl = (rawLabel.startsWith('{') && rawLabel.endsWith('}'))
        ? rawLabel.slice(1, -1) : rawLabel;
      var v = String(rawContent);
      var prefix = '';
      if (ev.role === 'confidence' && parent && parent.confidence) {
        var tierLabel = LABELS['conf_' + parent.confidence];
        if (tierLabel) {
          prefix = tierLabel.replace(/^\{|\}$/g, '') + ' — ';
        }
      }
      var pad = indent || '';
      if (v.startsWith('{') && v.endsWith('}')) {
        return pad + '- {**' + lbl + '** ' + prefix + v.slice(1, -1) + '}';
      }
      return pad + '- **' + lbl + '** ' + prefix + v;
    }

    // ---- Per-variant canvas MD formatter ----
    function formatCanvasVariantMd(variant) {
      var md = '# ' + LABELS.md_canvas_title + ' — ' + (variant.label || variant.slug) + '\n\n';
      (variant.cells || []).forEach(function(cell) {
        md += '## ' + (cell.name || cell.id) + '\n\n';

        // TBD cells: render a marker and skip body — schema flag cell.tbd === true.
        if (cell.tbd === true) {
          md += LABELS.md_tbd_marker + '\n\n';
          return;
        }

        // rec.decision (Problem & Stakes carries this; Alternatives / Capabilities /
        // Desired Outcomes / Pillars omit it per schema §6).
        if (cell.rec) {
          if (cell.rec.decision) {
            md += cell.rec.decision + '\n\n';
          }
          (cell.rec.evidence || []).forEach(function(ev) {
            md += _formatEvidenceBullet(ev, cell.rec) + '\n';
          });
          if ((cell.rec.evidence || []).length) md += '\n';
        }

        // Behavioral clusters (Alternatives cell): each cluster = bold label + member bullets.
        if (cell.clusters && cell.clusters.length) {
          cell.clusters.forEach(function(cluster) {
            md += '**' + (cluster.label || '') + '**\n\n';
            (cluster.members || []).forEach(function(m) {
              md += '- ' + m + '\n';
            });
            md += '\n';
          });
        }

        // Validation dimensions (Pillar cells).
        // badge may be a string (legacy) OR { value, label } object (current schema).
        if (cell.dimensions && cell.dimensions.length) {
          md += '### ' + LABELS.md_validation_dimensions_header + '\n\n';
          cell.dimensions.forEach(function(d) {
            var badgeText = (d.badge && typeof d.badge === 'object')
              ? (d.badge.label || d.badge.value || '')
              : (d.badge || '');
            md += '- **' + d.name + ':** ' + badgeText + '\n';
            (d.proofs || []).forEach(function(p) {
              md += '  - ' + p.text + ' (' + LABELS.md_source_label + ' ' + p.source + ')\n';
            });
            // Validation proposal — required when badge.value is "no_evidence".
            if (d.emptyDescription) {
              md += '  - **' + LABELS.md_validation_proposal_label + '** ' + d.emptyDescription + '\n';
            }
          });
          md += '\n';
        }

        // Decision-cell alternatives — each with full evidence + per-alt reasoning.
        if (cell.alternatives && cell.alternatives.length) {
          md += '### ' + LABELS.md_alternatives_considered + '\n\n';
          cell.alternatives.forEach(function(alt) {
            md += '- **' + (alt.label || LABELS.variant_alternative) + ':** ' + (alt.decision || '') + '\n';
            (alt.evidence || []).forEach(function(ev) {
              md += _formatEvidenceBullet(ev, alt, '  ') + '\n';
            });
            if (alt.reasoning) {
              if (alt.reasoning.why_this && alt.reasoning.why_this.length) {
                md += '  - **' + LABELS.why_this + ':**\n';
                alt.reasoning.why_this.forEach(function(b) { md += '    - ' + b + '\n'; });
              }
              if (alt.reasoning.when_to_choose && alt.reasoning.when_to_choose.length) {
                md += '  - **' + LABELS.when_this_might_be_fine + ':**\n';
                alt.reasoning.when_to_choose.forEach(function(b) { md += '    - ' + b + '\n'; });
              }
            }
          });
          md += '\n';
        }

        // Items (Capabilities / Desired Outcomes).
        if (cell.items) {
          md += '### ' + LABELS.md_items_header + '\n\n';
          cell.items.forEach(function(item) {
            var badge = item.classification || item.weighting || '';
            var firstEv = item.evidence && item.evidence.length ? item.evidence[0].content : '';
            var itemText = item.decision || firstEv || '';
            md += '- **' + (item.name || '') + '** (' + badge + '): ' + itemText + '\n';
            // Capabilities item — valueChain (feature → benefit → outcome).
            if (item.valueChain) {
              var vc = item.valueChain;
              if (vc.feature) md += '  - **' + LABELS.value_chain_feature + '** ' + vc.feature + '\n';
              if (vc.benefit) md += '  - **' + LABELS.value_chain_benefit + '** ' + vc.benefit + '\n';
              if (vc.outcome) md += '  - **' + LABELS.value_chain_outcome + '** ' + vc.outcome + '\n';
            }
          });
          md += '\n';
        }

        // Cell reasoning — included/left_out (curated) or why/when_differently (decision).
        if (cell.reasoning) {
          var r = cell.reasoning;
          if (r.why && r.why.length) {
            md += '### ' + LABELS.reasoning_header + '\n\n**' + LABELS.why_we_recommend + ':**\n';
            r.why.forEach(function(b) { md += '- ' + b + '\n'; });
            md += '\n';
          }
          if (r.when_differently && r.when_differently.length) {
            md += '**' + LABELS.when_to_choose_differently + ':**\n';
            r.when_differently.forEach(function(b) { md += '- ' + b + '\n'; });
            md += '\n';
          }
          if (r.included && r.included.length) {
            md += '### ' + LABELS.reasoning_header + '\n\n**' + LABELS.included_header + ':**\n';
            r.included.forEach(function(b) { md += '- ' + b + '\n'; });
            md += '\n';
          }
          if (r.left_out && r.left_out.length) {
            md += '**' + LABELS.left_out_header + ':**\n';
            r.left_out.forEach(function(b) { md += '- ' + b + '\n'; });
            md += '\n';
          }
        }
      });
      return md;
    }

    // ---- Per-variant copy MD formatter ----
    function formatCopyVariantMd(variant) {
      var copy = variant.copy || {};
      var md = '# ' + LABELS.md_copy_title + ' — ' + (variant.label || variant.slug) + '\n\n';
      // Urgency bar (optional)
      if (copy.urgencyBar && copy.urgencyBar.text) {
        md += '> ' + copy.urgencyBar.text + '\n\n';
      }
      // Hero
      if (copy.hero) {
        var h = copy.hero;
        md += '## ' + LABELS.copy_block_hero + '\n\n';
        if (h.headline) md += '**' + LABELS.md_headline_label + '** ' + h.headline + '\n\n';
        if (h.subhead) md += '**' + LABELS.md_subhead_label + '** ' + h.subhead + '\n\n';
        if (h.primaryCta) md += '- ' + LABELS.md_primary_cta_label + ' ' + h.primaryCta + '\n';
        if (h.secondaryCta) md += '- ' + LABELS.md_secondary_cta_label + ' ' + h.secondaryCta + '\n';
        if (h.visualHint) md += '- ' + LABELS.md_visual_hint_label + ' ' + h.visualHint + '\n';
        if (h.reasoning) md += '\n_' + LABELS.md_reasoning_inline + ' ' + h.reasoning + '_\n';
        md += '\n';
      }
      // Social proof
      if (copy.socialProof) {
        var sp = copy.socialProof;
        md += '## ' + LABELS.copy_block_social_proof + '\n\n';
        if (sp.metric) md += '- ' + LABELS.md_metric_label + ' ' + sp.metric + '\n';
        if (sp.logos) md += '- ' + LABELS.md_logos_label + ' ' + sp.logos + '\n';
        if (sp.quote) md += '- ' + LABELS.md_quote_label + ' "' + sp.quote + '"' + (sp.attribution ? ' — ' + sp.attribution : '') + '\n';
        if (sp.reasoning) md += '\n_' + LABELS.md_reasoning_inline + ' ' + sp.reasoning + '_\n';
        md += '\n';
      }
      // Value propositions
      if (copy.valueProps) {
        var vp = copy.valueProps;
        md += '## ' + LABELS.copy_block_value_props + '\n\n';
        (vp.items || []).forEach(function(p, i) {
          md += '### ' + LABELS.md_pillar + ' ' + (i + 1) + ' — ' + (p.headline || '') + '\n\n';
          if (p.body) md += p.body + '\n\n';
          if (p.proofRef) md += (p.isHypothesis ? '> ' + LABELS.md_hypothesis_prefix + ' ' : '→ ') + p.proofRef + '\n\n';
        });
        if (vp.reasoning) md += '_' + LABELS.md_reasoning_inline + ' ' + vp.reasoning + '_\n\n';
      }
      // Artifacts gallery
      if (copy.artifacts) {
        var art = copy.artifacts;
        md += '## ' + LABELS.copy_block_artifacts + '\n\n';
        if (art.intro) md += art.intro + '\n\n';
        (art.items || []).forEach(function(item) {
          md += '- **' + (item.name || '') + '** — ' + (item.contains || '') + '\n';
        });
        md += '\n';
        if (art.ctaPrimary) md += '_CTA: ' + art.ctaPrimary + '_\n\n';
        if (art.reasoning) md += '_' + LABELS.md_reasoning_inline + ' ' + art.reasoning + '_\n\n';
      }
      // How it works
      if (copy.howItWorks) {
        var hiw = copy.howItWorks;
        md += '## ' + LABELS.copy_block_how_it_works + '\n\n';
        (hiw.items || []).forEach(function(s, i) {
          md += (i + 1) + '. **' + (s.name || '') + '** — ' + (s.description || '') + '\n';
        });
        md += '\n';
        if (hiw.reasoning) md += '_' + LABELS.md_reasoning_inline + ' ' + hiw.reasoning + '_\n\n';
      }
      // Why us
      if (copy.whyUs) {
        var wu = copy.whyUs;
        md += '## ' + LABELS.copy_block_why_us + '\n\n';
        if (wu.opener) {
          md += '_' + wu.opener + '_\n\n';
        }
        var wuComparisons = Array.isArray(wu.comparisons) ? wu.comparisons : [];
        if (wuComparisons.length) {
          wuComparisons.forEach(function(c) {
            var mdTakeaway = c.takeaway || '';
            var mdSubline = c.subline || '';
            var mdVs = c.vs || c.alternative || '';
            var mdBody = c.body || c.contrast || '';
            if (mdTakeaway) md += '**' + mdTakeaway + '**\n\n';
            if (mdSubline) {
              md += '_' + mdSubline + '_\n\n';
            } else if (mdVs) {
              md += '_Wobec ' + mdVs + '._\n\n';
            }
            if (mdBody) md += mdBody + '\n\n';
          });
        } else if (wu.body) {
          md += wu.body + '\n\n';
        }
        if (wu.reasoning) md += '_' + LABELS.md_reasoning_inline + ' ' + wu.reasoning + '_\n\n';
      }
      // Packages
      if (copy.packages) {
        var pkg = copy.packages;
        md += '## ' + LABELS.copy_block_packages + '\n\n';
        if (pkg.intro) md += pkg.intro + '\n\n';
        (pkg.items || []).forEach(function(item) {
          md += '- **' + (item.name || '') + '**';
          if (item.price) md += ' (' + item.price + ')';
          if (item.forWhom) md += ' — ' + item.forWhom;
          md += '\n';
        });
        md += '\n';
        if (pkg.ctaPrimary) md += '_CTA: ' + pkg.ctaPrimary + '_\n\n';
        if (pkg.reasoning) md += '_' + LABELS.md_reasoning_inline + ' ' + pkg.reasoning + '_\n\n';
      }
      // Audit pitch
      if (copy.auditPitch) {
        var ap = copy.auditPitch;
        md += '## ' + LABELS.copy_block_audit_pitch + '\n\n';
        if (ap.headline) md += '**' + ap.headline + '**\n\n';
        if (ap.intro) md += ap.intro + '\n\n';
        (ap.youGet || []).forEach(function(line) { md += '- ' + line + '\n'; });
        md += '\n';
        if (ap.noStrings) md += '**' + ap.noStrings + '**\n\n';
        if (ap.ctaPrimary) md += '_CTA: ' + ap.ctaPrimary + '_\n\n';
        if (ap.reasoning) md += '_' + LABELS.md_reasoning_inline + ' ' + ap.reasoning + '_\n\n';
      }
      // Install pitch
      if (copy.installPitch) {
        var ip = copy.installPitch;
        md += '## ' + LABELS.copy_block_install_pitch + '\n\n';
        if (ip.headline) md += '**' + ip.headline + '**\n\n';
        if (ip.intro) md += ip.intro + '\n\n';
        (ip.steps || []).forEach(function(s, i) {
          md += (i+1) + '. **' + (s.name || '') + '** — ' + (s.description || '') + '\n';
        });
        md += '\n';
        if (ip.envs) md += '_Środowiska: ' + ip.envs + '_\n\n';
        if (ip.ctaPrimary) md += '_CTA: ' + ip.ctaPrimary + '_\n\n';
        if (ip.reasoning) md += '_' + LABELS.md_reasoning_inline + ' ' + ip.reasoning + '_\n\n';
      }
      // FAQ
      if (copy.faq) {
        var fq = copy.faq;
        md += '## ' + LABELS.copy_block_faq + '\n\n';
        (fq.items || []).forEach(function(item) {
          md += '**' + (item.question || '') + '**\n\n' + (item.answer || '') + '\n\n';
        });
        if (fq.reasoning) md += '_' + LABELS.md_reasoning_inline + ' ' + fq.reasoning + '_\n\n';
      }
      return md;
    }

    // ---- Multi-variant aggregators — concatenate each variant separated by ---
    function _formatCanvasAllMd(data) {
      var variants = (data && data.variants) || [];
      return variants.map(formatCanvasVariantMd).join('\n---\n\n');
    }
    function _formatCopyAllMd(data) {
      var variants = (data && data.variants) || [];
      return variants.map(formatCopyVariantMd).join('\n---\n\n');
    }

    // ---- Document-level MD formatters (per shared convention).
    // Contract: formatXxxMd(data) → { md: string, filename: string }.
    // See references/shared/interactive-deliverable-shell.md §MD export convention.
    function formatCanvasMd(data) {
      var ns = window.__shell.getNamespace() || 'messaging';
      return { md: _formatCanvasAllMd(data), filename: ns + '-canvas.md' };
    }
    function formatCopyMd(data) {
      var ns = window.__shell.getNamespace() || 'messaging';
      return { md: _formatCopyAllMd(data), filename: ns + '-copy.md' };
    }

    // ---- Universal download helper (matches audit + wireframing convention) ----
    function triggerDownload(filename, content, mime) {
      var blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    function _downloadHtml() {
      // Serialise the current document with populated data + any saved
      // LocalStorage state reflected in-place. Users can re-open the file
      // standalone and see the same canvas + copy view.
      var docClone = document.documentElement.cloneNode(true);
      var content = '<!DOCTYPE html>\n' + docClone.outerHTML;
      var ns = window.__shell.getNamespace() || 'messaging';
      triggerDownload(ns + '-messaging-canvas.html', content, 'text/html');
    }

    // ---- Download buttons ----
    var dlHtmlBtn = document.getElementById('mcDownloadHtmlBtn');
    if (dlHtmlBtn) {
      dlHtmlBtn.addEventListener('click', _downloadHtml);
    }
    var dlCanvasBtn = document.getElementById('mcDownloadCanvasBtn');
    if (dlCanvasBtn) {
      dlCanvasBtn.addEventListener('click', function() {
        var r = formatCanvasMd(_data);
        triggerDownload(r.filename, r.md, 'text/markdown');
      });
    }
    var dlCopyBtn = document.getElementById('mcDownloadCopyBtn');
    if (dlCopyBtn) {
      dlCopyBtn.addEventListener('click', function() {
        var r = formatCopyMd(_data);
        triggerDownload(r.filename, r.md, 'text/markdown');
      });
    }

    // ---- Init sequence ----
    // renderCanvas() must run before renderList() — panel uses canvas cell IDs for scroll-into-view binding.
    // _wireCanvasClicks() is called once; delegation survives future renderCanvas() re-renders.
    function _init() {
      renderCanvas();
      renderList();
      _wireCanvasClicks();
      // View toggle — Canvas / Copy buttons in the bottom bar
      var viewCanvasBtn = document.getElementById('mcViewCanvasBtn');
      var viewCopyBtn = document.getElementById('mcViewCopyBtn');
      if (viewCanvasBtn) viewCanvasBtn.addEventListener('click', function() { setActiveView('canvas'); });
      if (viewCopyBtn) viewCopyBtn.addEventListener('click', function() { setActiveView('copy'); });
    }

    document.addEventListener('DOMContentLoaded', _init);

    // If DOM already ready (script runs after DOMContentLoaded fires)
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      _init();
    }

  })();
  </script>
</body>
</html>
