  function detailBlock(label, text) {
    return '<div class="shell-detail__block"><h4 class="shell-detail__label">' + label + '</h4><p class="shell-detail__text">' + text + '</p></div>';
  }

  function renderInventoryList() {
    view = 'list';
    panelHeader.style.display = 'none';
    panelFilterArea.style.display = '';
    document.body.classList.remove('shell-detail-open');
    setActiveCanvasCard(null);

    renderFilterChips();

    const items = itemsForPage('inventory').filter(matchesFilter).filter(hasDetail);
    const kindGroups = [
      { key: 'section',  label: LABELS.group_kind_section },
      { key: 'template', label: LABELS.group_kind_template }
    ];
    const groupsHTML = kindGroups.map(function(g) {
      const groupItems = items.filter(function(it) { return it.kind === g.key; });
      if (!groupItems.length) return '';
      const listHTML = groupItems.map(function(item, idx) {
        const priorityPill  = item.priority_tier ? pill(PRIORITY_MAP, item.priority_tier) : '';
        const templatePill  = item.template_type ? pill(TEMPLATE_TYPE_MAP, item.template_type) : '';
        return ''
          + '<div class="shell-item" data-id="' + item.id + '">'
          +   '<div class="shell-item__row">'
          +     '<span class="shell-item__n">#' + (idx + 1) + '</span>'
          +     '<h4 class="shell-item__title">' + (item.title || item.id) + '</h4>'
          +     '<span class="shell-item__labels">' + priorityPill + templatePill + '</span>'
          +   '</div>'
          + '</div>';
      }).join('');
      return '<div class="shell-group" data-group="kind-' + g.key + '"><h4 class="shell-group-header">' + g.label + ' (' + groupItems.length + ')</h4><div class="shell-list">' + listHTML + '</div></div>';
    }).join('');
    const emptyHTML = '<div class="shell-empty">' + LABELS.group_empty + '</div>';

    panelBody.innerHTML = groupsHTML || emptyHTML;
  }

  function renderInventoryDetail(id) {
    view = 'detail';
    panelHeader.style.display = '';
    panelFilterArea.style.display = 'none';
    panelFilterArea.innerHTML = '';
    if (backBtn) backBtn.style.display = 'inline-block';
    if (navEl) navEl.style.display = 'flex';
    document.body.classList.add('shell-detail-open');

    const item = (itemsForPage('inventory')).find(function(x) { return x.id === id; });
    if (!item) return;
    setActiveCanvasCard(id);

    const blocks = [];
    if (item.rationale)    blocks.push(detailBlock(LABELS.detail_rationale, item.rationale));
    if (item.alternatives) blocks.push(detailBlock(LABELS.detail_alternatives, item.alternatives));
    const blocksHTML = blocks.length ? '<div class="shell-detail__blocks">' + blocks.join('') + '</div>' : '';

    panelBody.innerHTML = ''
      + '<h3 class="shell-detail__title">' + (item.title || item.id) + '</h3>'
      + blocksHTML;
    updateNavCounter();
  }

  function renderList() {
    if (currentPage === 'context')     return renderContextList();
    if (currentPage === 'strategy')    return renderStrategyList();
    if (currentPage === 'section-map') return renderSectionMapList();
    if (currentPage === 'inventory')   return renderInventoryList();
  }

  function renderDetail(id) {
    if (currentPage === 'context')     return renderContextDetail(id);
    if (currentPage === 'strategy')    return renderStrategyDetail(id);
    if (currentPage === 'section-map') return renderSectionMapDetail(id);
    if (currentPage === 'inventory')   return renderInventoryDetail(id);
  }

  function captureNavList() {
    navList = itemsForPage(currentPage).filter(matchesFilter).filter(hasDetail).map(function(it) { return { id: it.id }; });
  }
  function updateNavCounter() {
    if (!navList.length) {
      if (navCounter) navCounter.textContent = LABELS.nav_counter_empty;
      if (navPrevBtn) navPrevBtn.disabled = true;
      if (navNextBtn) navNextBtn.disabled = true;
      return;
    }
    if (navCounter) navCounter.textContent = tpl('nav_counter', { i: navIndex + 1, total: navList.length });
    if (navPrevBtn) navPrevBtn.disabled = navIndex <= 0;
    if (navNextBtn) navNextBtn.disabled = navIndex >= navList.length - 1;
  }
  function goPrev() {
    if (navIndex > 0) { navIndex--; renderDetail(navList[navIndex].id); }
  }
  function goNext() {
    if (navIndex < navList.length - 1) { navIndex++; renderDetail(navList[navIndex].id); }
  }

  function activatePage(slug) {
    if (VISIBLE_PAGES.indexOf(slug) === -1) return;
    currentPage = slug;
    resetFilter(slug);
    filterExpanded = false;
    const pages = document.querySelectorAll('.pp-page');
    pages.forEach(function(p) {
      p.classList.toggle('pp-page--active', p.id === 'pp-page-' + slug);
    });
    if (pageTabs) {
      pageTabs.querySelectorAll('.shell-bottombar__btn').forEach(function(btn) {
        btn.classList.toggle('is-active', btn.getAttribute('data-page') === slug);
      });
    }
    renderList();
  }

  if (panelToggle) panelToggle.addEventListener('click', togglePanel);

  if (pageTabs) {
    pageTabs.addEventListener('click', function(e) {
      const btn = e.target.closest('.shell-bottombar__btn[data-page]');
      if (!btn) return;
      const slug = btn.getAttribute('data-page');
      activatePage(slug);
      location.hash = '#' + slug;
    });
    window.addEventListener('hashchange', function() {
      const slug = (location.hash || '').slice(1);
      if (VISIBLE_PAGES.indexOf(slug) !== -1) activatePage(slug);
    });
  }

  panelBody.addEventListener('click', function(e) {
    const item = e.target.closest('.shell-item');
    if (item) {
      captureNavList();
      navIndex = navList.findIndex(function(x) { return x.id === item.dataset.id; });
      renderDetail(item.dataset.id);
    }
  });

  panelFilterArea.addEventListener('click', function(e) {
    const clearBtn = e.target.closest('#shellFilterClear');
    if (clearBtn) {
      resetFilter(currentPage);
      renderList();
      return;
    }
    const toggleBtn = e.target.closest('#shellFilterToggle');
    if (toggleBtn) {
      filterExpanded = !filterExpanded;
      renderList();
      return;
    }
    const chip = e.target.closest('.shell-chip');
    if (chip) {
      const axis = chip.dataset.filterAxis;
      const value = chip.dataset.filterValue;
      if (!axis) return;
      if (value === '__all') {
        activeFilter[axis] = [];
      } else {
        const arr = activeFilter[axis] || (activeFilter[axis] = []);
        const idx = arr.indexOf(value);
        if (idx === -1) arr.push(value);
        else arr.splice(idx, 1);
      }
      renderList();
    }
  });

  const ppMain = document.querySelector('.pp-main');
  if (ppMain) {
    ppMain.addEventListener('click', function(e) {
      const card = e.target.closest('.ui-card[data-id]:not(.ui-card--no-detail)');
      if (!card) return;
      const id = card.dataset.id;
      if (view === 'detail' && card.classList.contains('is-active')) {
        renderList();
        return;
      }
      openPanel();
      captureNavList();
      navIndex = navList.findIndex(function(x) { return x.id === id; });
      renderDetail(id);
    });
  }

  if (backBtn) backBtn.addEventListener('click', function() {
    if (view === 'detail') renderList();
  });
  if (navPrevBtn) navPrevBtn.addEventListener('click', goPrev);
  if (navNextBtn) navNextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && panel.classList.contains('is-open')) {
      if (view === 'detail') renderList();
      else closePanel();
    }
  });

  function _md_stripBraces(v) {
    var s = (v == null) ? '' : String(v);
    return (s.length >= 2 && s.charAt(0) === '{' && s.charAt(s.length - 1) === '}') ? s.slice(1, -1) : s;
  }
  function _md_confidenceLabel(c) {
    if (c === 'high')   return LABELS.md_confidence_confirmed;
    if (c === 'medium') return LABELS.md_confidence_likely;
    if (c === 'low')    return LABELS.md_confidence_tentative;
    return c || '';
  }
  function _md_priorityLabel(p) {
    if (p === 'critical')    return LABELS.priority_critical;
    if (p === 'significant') return LABELS.priority_significant;
    if (p === 'minor')       return LABELS.priority_minor;
    return p || '';
  }
  function _md_templateTypeLabel(t) {
    if (t === 'standard')       return LABELS.template_standard;
    if (t === 'corporate-pool') return LABELS.template_corporate_pool;
    if (t === 'modular')        return LABELS.template_modular;
    return t || '';
  }
  function _md_contentStatusLabel(s) {
    if (s === 'content-ready') return LABELS.pp_content_ready;
    if (s === 'needs-content') return LABELS.pp_needs_content;
    if (s === 'tbd')           return LABELS.pp_tbd_status;
    return s || '';
  }
  function _md_joinChips(arr) {
    if (!arr || !arr.length) return '';
    return arr.map(_md_stripBraces).join(', ');
  }
  function _md_renderCardBody(item) {
    var lines = [];
    if (item.lead) lines.push(_md_stripBraces(item.lead), '');
    if (item.body) lines.push(_md_stripBraces(item.body), '');
    if (item.kv && item.kv.length) {
      item.kv.forEach(function(entry) {
        var label = _md_stripBraces(entry.label);
        var value = _md_stripBraces(entry.value);
        lines.push('- **' + label + ':** ' + value);
      });
      lines.push('');
    }
    if (item.bullets && item.bullets.length) {
      item.bullets.forEach(function(b) { lines.push('- ' + _md_stripBraces(b)); });
      lines.push('');
    }
    if (item.ranked && item.ranked.length) {
      item.ranked.forEach(function(entry, i) {
        var text = _md_stripBraces(entry.text);
        var suffix = entry.priority ? ' (' + _md_stripBraces(entry.priority) + ')' : '';
        lines.push((i + 1) + '. ' + text + suffix);
      });
      lines.push('');
    }
    if (item.chips && item.chips.length) {
      item.chips.forEach(function(c) { lines.push('- ' + _md_stripBraces(c)); });
      lines.push('');
    }
    if (item.scope_split) {
      var inc = (item.scope_split.included || []).map(_md_stripBraces);
      var exc = (item.scope_split.excluded || []).map(_md_stripBraces);
      if (inc.length) lines.push('**' + LABELS.md_included + ':** ' + inc.join(', '));
      if (exc.length) lines.push('**' + LABELS.md_excluded + ':** ' + exc.join(', '));
      if (inc.length || exc.length) lines.push('');
    }
    if (item.confidence) {
      lines.push('**' + LABELS.md_confidence + ':** ' + _md_confidenceLabel(item.confidence));
    }
    if (item.meta_pills && item.meta_pills.length) {
      lines.push('**' + LABELS.md_meta_pills + ':** ' + _md_joinChips(item.meta_pills));
    }
    if (item.rationale) {
      lines.push('', '**' + LABELS.md_rationale + ':**', '', _md_stripBraces(item.rationale));
    }
    if (item.alternatives) {
      lines.push('', '**' + LABELS.md_alternatives + ':**', '', _md_stripBraces(item.alternatives));
    }
    return lines.join('\n').replace(/\n+$/, '');
  }
  function _md_renderTree(nodes, depth) {
    if (!nodes || !nodes.length) return '';
    var indent = new Array((depth || 0) + 1).join('  ');
    var out = [];
    nodes.forEach(function(n) {
      out.push(indent + '- ' + _md_stripBraces(n.name || n.id || ''));
      if (n.children && n.children.length) {
        out.push(_md_renderTree(n.children, (depth || 0) + 1));
      }
    });
    return out.join('\n');
  }

  function formatContextMd(data) {
    data = data || CONTEXT;
    var parts = ['# ' + LABELS.md_pp_context_title, ''];
    var byId = {};
    (data.items || []).forEach(function(it) { byId[it.id] = it; });
    var rows = (data.canvas && data.canvas.rows) || [];
    rows.forEach(function(row) {
      if (row.type !== 'cards') return;
      if (row.title) parts.push('## ' + _md_stripBraces(row.title), '');
      (row.card_ids || []).forEach(function(id) {
        var it = byId[id];
        if (!it) return;
        parts.push('### ' + _md_stripBraces(it.title || id), '');
        var body = _md_renderCardBody(it);
        if (body) parts.push(body, '');
        parts.push('---', '');
      });
    });
    return { md: parts.join('\n').replace(/\n+$/, '\n'), filename: NS + '-project-context.md' };
  }

  function formatStrategyMd(data) {
    data = data || STRATEGY;
    var parts = ['# ' + LABELS.md_pp_strategy_title, ''];
    var byId = {};
    (data.items || []).forEach(function(it) { byId[it.id] = it; });
    var rows = (data.canvas && data.canvas.rows) || [];
    rows.forEach(function(row) {
      if (row.type === 'cards') {
        if (row.title) parts.push('## ' + _md_stripBraces(row.title), '');
        (row.card_ids || []).forEach(function(id) {
          var it = byId[id];
          if (!it) return;
          parts.push('### ' + _md_stripBraces(it.title || id), '');
          var body = _md_renderCardBody(it);
          if (body) parts.push(body, '');
          parts.push('---', '');
        });
      } else if (row.type === 'heading') {
        if (row.title) parts.push('## ' + _md_stripBraces(row.title), '');
      } else if (row.type === 'tree' || row.type === 'sitemap') {
        var kind = row.kind || (row.type === 'sitemap' ? 'sitemap' : null);
        var nodes = row.nodes || (row.nodes_ref ? data[row.nodes_ref] : null) || [];
        var title = row.title ? _md_stripBraces(row.title) : (kind || '');
        parts.push('## ' + title, '');
        var meta = (kind === 'sitemap'   && data.sitemap_meta)   ? data.sitemap_meta
                 : (kind === 'main-menu' && data.main_menu_meta) ? data.main_menu_meta
                 : (kind === 'footer'    && data.footer_meta)    ? data.footer_meta
                 : null;
        var tree = _md_renderTree(nodes, 0);
        if (tree) parts.push(tree, '');
        if (meta && meta.rationale) {
          parts.push('**' + LABELS.md_rationale + ':**', '', _md_stripBraces(meta.rationale), '');
        }
        if (meta && meta.alternatives) {
          parts.push('**' + LABELS.md_alternatives + ':**', '', _md_stripBraces(meta.alternatives), '');
        }
        parts.push('---', '');
      }
    });
    var iaItems = (data.items || []).filter(function(it) { return it.scope === 'ia'; });
    if (iaItems.length) {
      parts.push('## ' + LABELS.md_strategy_section_ia, '');
      iaItems.forEach(function(it) {
        parts.push('### ' + _md_stripBraces(it.title || it.id), '');
        if (it.element)         parts.push('- **' + LABELS.md_element + ':** ' + _md_stripBraces(it.element));
        if (it.decision_status) parts.push('- **' + LABELS.md_decision_status + ':** ' + _md_stripBraces(it.decision_status));
        if (it.confidence)      parts.push('- **' + LABELS.md_confidence + ':** ' + _md_confidenceLabel(it.confidence));
        parts.push('');
        if (it.rationale) {
          parts.push('**' + LABELS.md_rationale + ':**', '', _md_stripBraces(it.rationale), '');
        }
        if (it.alternatives) {
          parts.push('**' + LABELS.md_alternatives + ':**', '', _md_stripBraces(it.alternatives), '');
        }
        parts.push('---', '');
      });
    }
    return { md: parts.join('\n').replace(/\n+$/, '\n'), filename: NS + '-project-strategy.md' };
  }

  function formatSectionMapMd(data) {
    data = data || SECTION_MAP;
    var parts = ['# ' + LABELS.md_pp_section_map_title, ''];
    var pages = data.page_sections || [];
    var sections = (data.items || []).filter(function(it) { return it.scope === 'section'; });
    pages.forEach(function(page) {
      var name = _md_stripBraces(page.name || page.page_id || '');
      var goal = page.goal ? ': ' + _md_stripBraces(page.goal) : '';
      parts.push('## ' + name + goal, '');
      if (page.top_tasks_served && page.top_tasks_served.length) {
        parts.push('*' + LABELS.md_top_tasks_served + ':* ' + _md_joinChips(page.top_tasks_served), '');
      }
      var pageSections = sections.filter(function(s) { return s.page_id === page.page_id; });
      pageSections.forEach(function(s) {
        var heading = '### ' + _md_stripBraces(s.title || s.id || '');
        if (s.narrative) heading += ': ' + _md_stripBraces(s.narrative);
        var pillBits = [];
        if (s.confidence)     pillBits.push(_md_confidenceLabel(s.confidence));
        if (s.content_status) pillBits.push(_md_contentStatusLabel(s.content_status));
        if (pillBits.length) heading += ' (' + pillBits.join(', ') + ')';
        parts.push(heading, '');
        if (s.goal)                parts.push('- **' + LABELS.md_goal + ':** ' + _md_stripBraces(s.goal));
        if (s.question)            parts.push('- **' + LABELS.md_question + ':** ' + _md_stripBraces(s.question));
        if (s.content_description) parts.push('- **' + LABELS.md_content_description + ':** ' + _md_stripBraces(s.content_description));
        if (s.rationale)           parts.push('- **' + LABELS.md_rationale + ':** ' + _md_stripBraces(s.rationale));
        if (s.alternatives)        parts.push('- **' + LABELS.md_alternatives + ':** ' + _md_stripBraces(s.alternatives));
        parts.push('');
      });
      parts.push('---', '');
    });
    return { md: parts.join('\n').replace(/\n+$/, '\n'), filename: NS + '-section-map.md' };
  }

  function formatInventoryMd(data) {
    data = data || INVENTORY;
    var parts = ['# ' + LABELS.md_pp_inventory_title, ''];
    var summary = data.summary || {};
    var sectionsNeeding = (typeof summary.sections_needing_content === 'number')
      ? summary.sections_needing_content
      : (data.section_index || []).filter(function(s) { return s.content_status !== 'content-ready'; }).length;
    parts.push('## ' + LABELS.md_inventory_section_summary, '');
    parts.push('- **' + LABELS.md_inventory_summary_total_templates + ':** ' + (summary.total_templates || 0));
    parts.push('- **' + LABELS.md_inventory_summary_unique_sections + ':** ' + (summary.unique_sections || 0));
    parts.push('- **' + LABELS.md_inventory_summary_sections_needing_content + ':** ' + sectionsNeeding);
    parts.push('', '---', '');
    var templateMap = data.template_map || [];
    if (templateMap.length) {
      parts.push('## ' + LABELS.md_inventory_section_template_map, '');
      templateMap.forEach(function(t) {
        var heading = '### ' + _md_stripBraces(t.name || t.id || '');
        if (t.template_type) heading += ' (' + _md_templateTypeLabel(t.template_type) + ')';
        parts.push(heading, '');
        if (t.goal)         parts.push('- **' + LABELS.md_goal + ':** ' + _md_stripBraces(t.goal));
        if (t.pages_using && t.pages_using.length) {
          parts.push('- **' + LABELS.md_pages_using + ':** ' + _md_joinChips(t.pages_using));
        }
        parts.push('');
      });
      parts.push('---', '');
    }
    var sectionIndex = data.section_index || [];
    var sectionById = {};
    sectionIndex.forEach(function(s) { sectionById[s.id] = s; });
    if (sectionIndex.length) {
      parts.push('## ' + LABELS.md_inventory_section_section_index, '');
      sectionIndex.forEach(function(s) {
        var heading = '### ' + _md_stripBraces(s.name || s.id || '');
        var pillBits = [];
        if (s.priority_tier)  pillBits.push(_md_priorityLabel(s.priority_tier));
        if (s.template_type)  pillBits.push(_md_templateTypeLabel(s.template_type));
        if (s.content_status) pillBits.push(_md_contentStatusLabel(s.content_status));
        if (pillBits.length) heading += ' (' + pillBits.join(', ') + ')';
        parts.push(heading, '');
        if (s.narrative)   parts.push('- **' + LABELS.md_narrative + ':** ' + _md_stripBraces(s.narrative));
        if (s.used_in && s.used_in.length) {
          parts.push('- **' + LABELS.md_used_in + ':** ' + _md_joinChips(s.used_in));
        }
        if (s.goal)        parts.push('- **' + LABELS.md_goal + ':** ' + _md_stripBraces(s.goal));
        if (s.question)    parts.push('- **' + LABELS.md_question + ':** ' + _md_stripBraces(s.question));
        if (s.key_message) parts.push('- **' + LABELS.md_key_message + ':** ' + _md_stripBraces(s.key_message));
        if (s.atoms && s.atoms.length) {
          parts.push('- **' + LABELS.md_atoms + ':** ' + _md_joinChips(s.atoms));
        }
        if (s.variants && s.variants.length) {
          parts.push('- **' + LABELS.md_variants + ':** ' + _md_joinChips(s.variants));
        }
        if (s.confidence)  parts.push('- **' + LABELS.md_confidence + ':** ' + _md_confidenceLabel(s.confidence));
        parts.push('');
        if (s.rationale) {
          parts.push('**' + LABELS.md_rationale + ':**', '', _md_stripBraces(s.rationale), '');
        }
        if (s.alternatives) {
          parts.push('**' + LABELS.md_alternatives + ':**', '', _md_stripBraces(s.alternatives), '');
        }
        parts.push('---', '');
      });
    }
    var templates = data.templates || [];
    if (templates.length) {
      parts.push('## ' + LABELS.md_inventory_section_template_arch, '');
      templates.forEach(function(t) {
        var heading = '### ' + _md_stripBraces(t.name || t.id || '');
        if (t.template_type) heading += ': ' + _md_templateTypeLabel(t.template_type);
        parts.push(heading, '');
        if (t.template_type === 'standard') {
          (t.sections || []).forEach(function(secId, i) {
            var sec = sectionById[secId];
            if (!sec) { parts.push((i + 1) + '. ' + _md_stripBraces(secId)); return; }
            var name = _md_stripBraces(sec.name || sec.id);
            var narr = sec.narrative ? ' (' + _md_stripBraces(sec.narrative) + ')' : '';
            parts.push((i + 1) + '. ' + name + narr);
          });
          parts.push('');
        } else if (t.template_type === 'corporate-pool') {
          var sharedNames = (t.shared_sections || []).map(function(secId) {
            var sec = sectionById[secId];
            return _md_stripBraces(sec ? (sec.name || sec.id) : secId);
          });
          if (sharedNames.length) {
            parts.push('**' + LABELS.md_inventory_template_arch_corp_pool_shared + ':** ' + sharedNames.join(', '));
          }
          var pool = t.pool_sections || [];
          if (pool.length) {
            parts.push('**' + LABELS.md_inventory_template_arch_corp_pool_variants + ':**');
            pool.forEach(function(v) {
              var name = _md_stripBraces(v.name || v.id || '');
              var usedBy = (v.used_by && v.used_by.length) ? ': ' + _md_joinChips(v.used_by) : '';
              parts.push('- ' + name + usedBy);
            });
          }
          parts.push('');
        } else if (t.template_type === 'modular') {
          var atoms = (t.atoms || []).map(_md_stripBraces);
          if (atoms.length) {
            parts.push('**' + LABELS.md_inventory_template_arch_modular_atoms + ':** ' + atoms.join(', '));
          }
          parts.push('');
        }
        parts.push('---', '');
      });
    }
    return { md: parts.join('\n').replace(/\n+$/, '\n'), filename: NS + '-design-plan.md' };
  }

  function triggerDownload(filename, content, mime) {
    var blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function _downloadHtml() {
    var docClone = document.documentElement.cloneNode(true);
    var content = '<!DOCTYPE html>\n' + docClone.outerHTML;
    triggerDownload(NS + '-project-plan.html', content, 'text/html');
  }

  var dlContextBtn = document.getElementById('shellDownloadContextMd');
  if (dlContextBtn) dlContextBtn.addEventListener('click', function() {
    var r = formatContextMd(CONTEXT);
    triggerDownload(r.filename, r.md, 'text/markdown');
  });
  var dlStrategyBtn = document.getElementById('shellDownloadStrategyMd');
  if (dlStrategyBtn) dlStrategyBtn.addEventListener('click', function() {
    var r = formatStrategyMd(STRATEGY);
    triggerDownload(r.filename, r.md, 'text/markdown');
  });
  var dlSectionMapBtn = document.getElementById('shellDownloadSectionMapMd');
  if (dlSectionMapBtn) dlSectionMapBtn.addEventListener('click', function() {
    var r = formatSectionMapMd(SECTION_MAP);
    triggerDownload(r.filename, r.md, 'text/markdown');
  });
  var dlInventoryBtn = document.getElementById('shellDownloadInventoryMd');
  if (dlInventoryBtn) dlInventoryBtn.addEventListener('click', function() {
    var r = formatInventoryMd(INVENTORY);
    triggerDownload(r.filename, r.md, 'text/markdown');
  });
  var dlHtmlBtn = document.getElementById('shellDownloadHtml');
  if (dlHtmlBtn) dlHtmlBtn.addEventListener('click', _downloadHtml);

  applyStaticLabels();
  function applyTemplateStockVisibility() {
    if (DEMO_MODE) return;
    var MD_BUTTON_BY_SLUG = {
      'context':     'shellDownloadContextMd',
      'strategy':    'shellDownloadStrategyMd',
      'section-map': 'shellDownloadSectionMapMd',
      'inventory':   'shellDownloadInventoryMd'
    };
    ALL_PAGES.forEach(function(slug) {
      if (VISIBLE_PAGES.indexOf(slug) !== -1) return;
      if (pageTabs) {
        var btn = pageTabs.querySelector('.shell-bottombar__btn[data-page="' + slug + '"]');
        if (btn) btn.style.display = 'none';
      }
      var pageEl = document.getElementById('pp-page-' + slug);
      if (pageEl) pageEl.style.display = 'none';
      var dlBtn = document.getElementById(MD_BUTTON_BY_SLUG[slug]);
      if (dlBtn) dlBtn.style.display = 'none';
    });
    var dlHtmlBtn = document.getElementById('shellDownloadHtml');
    if (dlHtmlBtn && VISIBLE_PAGES.length === 0) dlHtmlBtn.style.display = 'none';
    var dlGroup = document.getElementById('shellDownloadGroup');
    if (dlGroup && VISIBLE_PAGES.length === 0) dlGroup.style.display = 'none';
  }
  applyTemplateStockVisibility();
  if (VISIBLE_PAGES.indexOf('context') !== -1)     renderContextSubPage();
  if (VISIBLE_PAGES.indexOf('strategy') !== -1)    renderStrategySubPage();
  if (VISIBLE_PAGES.indexOf('section-map') !== -1) renderSectionMapSubPage();
  if (VISIBLE_PAGES.indexOf('inventory') !== -1)   renderInventorySubPage();
  const initialHash = (location.hash || '').slice(1);
  let initialPage;
  if (VISIBLE_PAGES.indexOf(initialHash) !== -1) {
    initialPage = initialHash;
  } else if (VISIBLE_PAGES.indexOf('context') !== -1) {
    initialPage = 'context';
  } else {
    initialPage = VISIBLE_PAGES[0];
  }
  if (initialPage) activatePage(initialPage);

  let initialOpen = null;
  try { initialOpen = localStorage.getItem(NS + '-panel-open'); } catch (e) {}
  if (initialOpen === '1') openPanel();
})();
</script>
