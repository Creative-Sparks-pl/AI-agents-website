  function renderCanvasFromRows(slug, data) {
    const host = document.querySelector('#pp-page-' + slug + ' .ui-card-grid');
    if (!host) return;
    const rows = (data.canvas && data.canvas.rows) || [];
    const byId = {};
    (data.items || []).forEach(function(i) { byId[i.id] = i; });
    if (slug === 'inventory') {
      (data.template_map || []).forEach(function(t) { byId[t.id] = Object.assign({}, t, { _kind: 'template' }); });
      (data.section_index || []).forEach(function(s) { byId[s.id] = Object.assign({}, s, { _kind: 'section' }); });
    }
    host.innerHTML = rows.map(function(r) { return rowHtml(r, byId, data); }).join('');
    bindTreeToggles(host);
  }

  // Row-click routing for pp-tree nodes. Called after every canvas render
  // because innerHTML replacement wipes any prior listeners.
  //
  // Click routing:
  //   - Click on .pp-tree-toggle (the +/- button) → toggle expand/collapse only.
  //   - Click on row body (anywhere else) → (1) toggle if parent; (2) if node
  //     has an id (lvl 2+), also select the node and open the left panel with
  //     its detail. Lvl-1 root rows (Main menu / Sitemap / Footer) carry no
  //     node id — body click just toggles the whole card.
  function bindTreeToggles(hostEl) {
    hostEl.querySelectorAll('.pp-tree-card').forEach(function(card) {
      const kind = card.dataset.treeKind;
      card.querySelectorAll('.pp-tree-row').forEach(function(row) {
        row.addEventListener('click', function(e) {
          const node = row.parentElement;
          if (!node) return;
          const clickedToggle = !!e.target.closest('.pp-tree-toggle');
          const nodeId = node.dataset.pageId || node.dataset.nodeId;
          const hasChildren = node.hasAttribute('data-expanded');

          // Toggle button click → toggle only, no panel.
          if (clickedToggle) {
            if (hasChildren) {
              const expanded = node.getAttribute('data-expanded') === 'true';
              node.setAttribute('data-expanded', expanded ? 'false' : 'true');
            }
            return;
          }

          // Inner nodes (lvl 2+): just toggle, no panel interaction.
          if (nodeId) {
            if (hasChildren) {
              const expanded = node.getAttribute('data-expanded') === 'true';
              node.setAttribute('data-expanded', expanded ? 'false' : 'true');
            }
            return;
          }
          // Lvl-1 root: expand state ↔ panel open ↔ row selected are tightly
          // coupled. Clicking an open zone closes everything; clicking a
          // closed zone closes any other open zone first, then opens this one.
          const isOpen = node.getAttribute('data-expanded') === 'true';
          if (isOpen) {
            collapseAllTreeZones();
            closePanel();
            return;
          }
          collapseAllTreeZones();
          node.setAttribute('data-expanded', 'true');
          row.classList.add('is-selected');
          openPanel();
          renderTreeZoneDetail(kind);
        });
      });
    });
  }

  // Walk the three IA-frame trees to find a node by id + its ancestor path.
  // Returns [] if not found. Path includes the node itself as the last entry.
  function findTreeNodePath(kind, nodeId) {
    const trees = {
      'main-menu': (STRATEGY && STRATEGY.main_menu) || [],
      'sitemap':   (STRATEGY && STRATEGY.sitemap)   || [],
      'footer':    (STRATEGY && STRATEGY.footer)    || []
    };
    const roots = trees[kind] || [];
    function walk(nodes, path) {
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const newPath = path.concat([n]);
        if (n.id === nodeId) return newPath;
        if (n.children && n.children.length) {
          const found = walk(n.children, newPath);
          if (found) return found;
        }
      }
      return null;
    }
    return walk(roots, []) || [];
  }

  // Detail renderer for a tree ZONE (lvl-1 root click — Main menu / Sitemap /
  // Footer). Shows zone name + rationale/alternatives from the matching
  // top-level meta object (`main_menu_meta`, `sitemap_meta`, `footer_meta`).
  // The meta objects are optional — panel renders with just the zone title
  // when the agent hasn't populated reasoning yet.
  function renderTreeZoneDetail(kind) {
    view = 'detail';
    panelHeader.style.display = '';
    panelFilterArea.style.display = 'none';
    panelFilterArea.innerHTML = '';
    if (backBtn) backBtn.style.display = 'inline-block';
    if (navEl) navEl.style.display = 'flex';
    document.body.classList.add('shell-detail-open');

    const metaKey = kind.replace('-', '_') + '_meta';
    const meta = (STRATEGY && STRATEGY[metaKey]) || {};
    const zoneLabel = { 'main-menu': 'Main menu', 'sitemap': 'Sitemap', 'footer': 'Footer' }[kind] || kind;

    const blocks = [];
    if (meta.rationale)    blocks.push(detailBlock(LABELS.detail_rationale, meta.rationale));
    if (meta.alternatives) blocks.push(detailBlock(LABELS.detail_alternatives, meta.alternatives));
    const blocksHTML = blocks.length ? '<div class="shell-detail__blocks">' + blocks.join('') + '</div>' : '';

    panelBody.innerHTML = ''
      + '<h3 class="shell-detail__title">' + zoneLabel + '</h3>'
      + blocksHTML;
  }

  // Detail renderer for an IA-frame tree node. Renders name + zone (kind) +
  // ancestor path (if any) + optional rationale/alternatives (schema-open —
  // node carries these fields when the agent has populated them).
  function renderTreeNodeDetail(kind, nodeId) {
    view = 'detail';
    panelHeader.style.display = '';
    panelFilterArea.style.display = 'none';
    panelFilterArea.innerHTML = '';
    if (backBtn) backBtn.style.display = 'inline-block';
    if (navEl) navEl.style.display = 'flex';
    document.body.classList.add('shell-detail-open');

    const path = findTreeNodePath(kind, nodeId);
    if (!path.length) return;
    const node = path[path.length - 1];
    const zoneLabel = { 'main-menu': 'Main menu', 'sitemap': 'Sitemap', 'footer': 'Footer' }[kind] || kind;

    const metaRows = [];
    metaRows.push('<dt>' + (LABELS.detail_tree_zone || 'Zone') + '</dt><dd>' + zoneLabel + '</dd>');
    if (path.length > 1) {
      const ancestors = path.slice(0, -1).map(function(n) { return n.name || n.id; }).join(' / ');
      metaRows.push('<dt>' + (LABELS.detail_tree_path || 'Path') + '</dt><dd>' + ancestors + '</dd>');
    }
    const meta = metaRows.join('');

    const blocks = [];
    if (node.rationale)    blocks.push(detailBlock(LABELS.detail_rationale, node.rationale));
    if (node.alternatives) blocks.push(detailBlock(LABELS.detail_alternatives, node.alternatives));
    const blocksHTML = blocks.length ? '<div class="shell-detail__blocks">' + blocks.join('') + '</div>' : '';

    panelBody.innerHTML = ''
      + '<h3 class="shell-detail__title">' + (node.name || nodeId) + '</h3>'
      + (meta ? '<dl class="shell-detail__meta">' + meta + '</dl>' : '')
      + blocksHTML;
  }

  function rowHtml(row, byId, data) {
    if (row.type === 'summary')       return summaryHtml(data.summary, data);
    if (row.type === 'heading')       return '<h2 class="ui-card-row-title">' + (row.title || '') + '</h2>';
    if (row.type === 'tree')          return treeRowHtml(resolveTreeRow(row, data));
    if (row.type === 'sitemap')       return treeRowHtml(resolveTreeRow(Object.assign({ kind: 'sitemap', title: row.title || 'Sitemap' }, row), data));
    if (row.type === 'page-map')      return pageMapHtml(row, data);
    if (row.type === 'template-arch') return templateArchHtml((data.templates || []).find(function(t) { return t.id === row.template_id; }));
    return cardsRowHtml(row, byId);
  }

  // Resolve nodes_ref (string key into data) to concrete nodes[]. If row already
  // carries inline nodes[], pass through. Reviewer fix 1 — resolution happens at
  // the dispatcher level so treeRowHtml receives a fully-resolved row.
  function resolveTreeRow(row, data) {
    if (row.nodes && row.nodes.length) return row;
    if (row.nodes_ref && data && data[row.nodes_ref]) {
      return Object.assign({}, row, { nodes: data[row.nodes_ref] });
    }
    return Object.assign({}, row, { nodes: [] });
  }

  function cardsRowHtml(row, byId) {
    const title = row.title ? '<h2 class="ui-card-row-title">' + row.title + '</h2>' : '';
    const cards = (row.card_ids || []).map(function(id) { return cardHtml(byId[id]); }).filter(Boolean).join('');
    if (row.variant == null) {
      return title + '<div class="pp-section-index">' + cards + '</div>';
    }
    return title + '<div class="ui-card-row ui-card-row--' + row.variant + '">' + cards + '</div>';
  }

  function cardHtml(item) {
    if (!item) return '';
    if (item._kind === 'template') return templateMapCardHtml(item);
    if (item._kind === 'section')  return sectionIndexCardHtml(item);
    switch (item.layout) {
      case 'simple-meta':  return simpleMetaCardHtml(item);
      case 'chip-list':    return chipListCardHtml(item);
      case 'ranked-list':  return rankedListCardHtml(item);
      case 'scope-split':  return scopeSplitCardHtml(item);
      case 'section-card': return sectionCardHtml(item);
      default:             return '';
    }
  }

  function simpleMetaCardHtml(item) {
    const heading = item.name || item.title || '';
    const leadHtml = item.lead ? '<p class="lead">' + item.lead + '</p>' : '';
    const bodyHtml = item.body ? '<p>' + item.body + '</p>' : '';
    const kvHtml = (item.kv && item.kv.length)
      ? item.kv.map(kvSeg).join('')
      : '';
    // bullets[] — free-form placeholder list (each entry is a unified `{...}` string
    // rendered verbatim inside <li>). Used by the Alternatives card for behavior
    // clusters — agent keeps/drops/renames clusters per project.
    const bulletsHtml = (item.bullets && item.bullets.length)
      ? '<ul class="pp-bullets">' + item.bullets.map(function(b) { return '<li>' + b + '</li>'; }).join('') + '</ul>'
      : '';
    const metaPillsHtml = (item.meta_pills || []).map(plainChip).join('');
    const confPill = item.confidence
      ? '<span class="ui-card__meta-label">' + LABELS.axis_confidence + ':</span>' + pill(CONF_MAP, item.confidence)
      : '';
    const metaBlock = (metaPillsHtml || confPill)
      ? '<div class="ui-card__meta">' + metaPillsHtml + confPill + '</div>'
      : '';
    return ''
      + '<article class="ui-card' + cardNoDetailClass(item) + '" data-id="' + item.id + '">'
      +   '<h4>' + heading + '</h4>'
      +   leadHtml + bodyHtml + kvHtml + bulletsHtml
      +   metaBlock
      + '</article>';
  }

  function chipListCardHtml(item) {
    const heading = item.name || item.title || '';
    const leadHtml = item.lead ? '<p class="lead">' + item.lead + '</p>' : '';
    const chipsHtml = (item.chips || []).map(plainChip).join('');
    const chipsBlock = chipsHtml ? '<div class="pp-chips">' + chipsHtml + '</div>' : '';
    return ''
      + '<article class="ui-card' + cardNoDetailClass(item) + '" data-id="' + item.id + '">'
      +   '<h4>' + heading + '</h4>'
      +   leadHtml + chipsBlock
      +   confidenceBadge(item.confidence)
      + '</article>';
  }

  function rankedListCardHtml(item) {
    const heading = item.name || item.title || '';
    const leadHtml = item.lead ? '<p class="lead">' + item.lead + '</p>' : '';
    const listHtml = (item.ranked || []).map(function(r, i) {
      const rightPill = r.priority ? plainChip(r.priority) : '';
      return '<li><span><span class="pp-rank-n">' + (i + 1) + '</span>' + r.text + '</span>' + rightPill + '</li>';
    }).join('');
    return ''
      + '<article class="ui-card' + cardNoDetailClass(item) + '" data-id="' + item.id + '">'
      +   '<h4>' + heading + '</h4>'
      +   leadHtml
      +   (listHtml ? '<ol class="pp-ranked">' + listHtml + '</ol>' : '')
      +   confidenceBadge(item.confidence)
      + '</article>';
  }

  function scopeSplitCardHtml(item) {
    const heading = item.name || item.title || '';
    const s = item.scope_split || {};
    const incHtml = (s.included || []).map(function(t) { return '<li>' + t + '</li>'; }).join('');
    const excHtml = (s.excluded || []).map(function(t) { return '<li class="pp-excluded">' + t + '</li>'; }).join('');
    return ''
      + '<article class="ui-card' + cardNoDetailClass(item) + '" data-id="' + item.id + '">'
      +   '<h4>' + heading + '</h4>'
      +   '<div class="pp-scope">'
      +     '<div><strong>' + (LABELS.pp_scope_included || 'Included') + '</strong><ul class="pp-scope-list">' + incHtml + '</ul></div>'
      +     '<div><strong>' + (LABELS.pp_scope_excluded || 'Excluded') + '</strong><ul class="pp-scope-list">' + excHtml + '</ul></div>'
      +   '</div>'
      +   confidenceBadge(item.confidence)
      + '</article>';
  }

  // Six-field section card — Name + narrative tag (inline in h4);
  // then labeled rows for Goal / Message / Content; readiness pill labeled
  // in .ui-card__meta. Confidence is NOT rendered on the card —
  // rationale + confidence live in the left panel.
  function sectionCardHtml(item) {
    const heading = item.name || item.title || '';
    const narrInline = item.narrative ? ' ' + narrativeTag(item.narrative) : '';
    const readinessPill = contentStatusPill(item.content_status);
    const fields = [
      sectionFieldRow(LABELS.pp_section_card_goal      || 'Goal:',      item.goal),
      sectionFieldRow(LABELS.pp_section_card_message   || 'Message:',   item.question),
      sectionFieldRow(LABELS.pp_section_card_readiness || 'Readiness:', readinessPill),
      sectionFieldRow(LABELS.pp_section_card_content   || 'Content:',   sectionContentValue(item.content_description))
    ].join('');
    return ''
      + '<article class="ui-card' + cardNoDetailClass(item) + '" data-id="' + item.id + '">'
      +   '<h4>' + heading + narrInline + '</h4>'
      +   fields
      + '</article>';
  }

  // One labeled row inside a section card. Value can be a string (inline
  // after the label) or HTML already wrapped (e.g. <ul>…</ul>) — the row
  // container handles both cases.
  function sectionFieldRow(label, value) {
    if (!value) return '';
    return '<p class="pp-section-card__field"><span class="pp-section-card__field-label">' + label + '</span>' + value + '</p>';
  }

  // Content description always renders as a bullet list for visual
  // consistency across cards. Single string → one <li>; array → one <li>
  // each. Uniform list treatment means Content rows have the same vertical
  // rhythm as Atoms / Variants chip rows or paragraph-shaped fields.
  function sectionContentValue(content) {
    if (!content) return '';
    const items = Array.isArray(content) ? content : [content];
    if (!items.length) return '';
    return '<ul class="pp-section-card__content-list">' + items.map(function(c) { return '<li>' + c + '</li>'; }).join('') + '</ul>';
  }

  function templateMapCardHtml(item) {
    const usage = templateUsageLabel(item.pages_using);
    const L = function(key, fallback) {
      const v = LABELS[key];
      if (v == null) return fallback;
      const s = String(v);
      return s.startsWith('{') && s.endsWith('}') ? s.slice(1, -1) : s;
    };
    const parts = [
      usage              ? metaSeg(L('pp_inventory_field_usage',   'Usage'),       usage)             : '',
      item.goal          ? metaSeg(L('pp_inventory_field_goal',    'Goal'),        item.goal)         : '',
      listSeg(L('detail_pages_using', 'Pages using'), item.pages_using)
    ].join('');
    return ''
      + '<article class="ui-card' + cardNoDetailClass(item) + '" data-id="' + item.id + '">'
      +   '<h4>' + (item.name || item.id) + '</h4>'
      +   parts
      + '</article>';
  }

  // Derive "Single page" vs. "Reusable (N pages)" from pages_using.length.
  // Replaces the old `template_type` card meta per simplification — the
  // architecture distinction (Standard / Corporate Pool / Modular) used to
  // drive the per-template arch blocks at the bottom of Design plan; those
  // blocks were dropped, so template_type is no longer surfaced on cards.
  // Returns a unified `{…}` placeholder so metaSeg wraps the whole line
  // as `{Usage: …}` on placeholder data.
  function templateUsageLabel(pagesUsing) {
    const arr = pagesUsing || [];
    if (!arr.length) return '';
    const stripBraces = function(s) {
      const v = String(s || '');
      return v.startsWith('{') && v.endsWith('}') ? v.slice(1, -1) : v;
    };
    if (arr.length === 1) return '{' + stripBraces(LABELS.pp_inventory_usage_single || 'Single page') + '}';
    const base = stripBraces(LABELS.pp_inventory_usage_reusable || 'Reusable');
    return '{' + base + ' (' + arr.length + ' pages)}';
  }

  function sectionIndexCardHtml(item) {
    // template_type dropped from card meta — per-template arch blocks no
    // longer render on Design plan, so the field is dead signal on the card.
    // Priority moves to .ui-card__meta at the bottom as a labeled colored
    // pill (red/amber/green via PRIORITY_MAP) with top separator.
    // Readiness uses the colored pill (matches Section map's labeled-row
    // treatment) instead of plain text.
    const L = function(key, fallback) {
      const v = LABELS[key];
      if (v == null) return fallback;
      const s = String(v);
      return s.startsWith('{') && s.endsWith('}') ? s.slice(1, -1) : s;
    };
    const parts = [
      item.narrative           ? metaSeg(L('pp_inventory_field_narrative',    'Narrative'),    item.narrative)                        : '',
      item.goal                ? metaSeg(L('pp_inventory_field_goal',         'Goal'),         item.goal)                             : '',
      item.question            ? metaSeg(L('pp_inventory_field_question',     'Question'),     item.question)                         : '',
      item.key_message         ? metaSeg(L('pp_inventory_field_key_message',  'Key message'),  item.key_message)                      : '',
      listSeg(L('pp_inventory_field_used_in', 'Used in'), item.used_in),
      listChipsSeg(L('pp_inventory_field_atoms',    'Atoms'),    item.atoms),
      listChipsSeg(L('pp_inventory_field_variants', 'Variants'), item.variants),
      item.content_status      ? metaSeg(L('pp_inventory_field_readiness',    'Readiness'),    contentStatusPill(item.content_status)) : ''
    ].join('');
    const priorityMeta = item.priority_tier
      ? '<div class="ui-card__meta"><span class="ui-card__meta-label">' + LABELS.axis_priority + ':</span>' + pill(PRIORITY_MAP, item.priority_tier) + '</div>'
      : '';
    return ''
      + '<article class="ui-card' + cardNoDetailClass(item) + '" data-id="' + item.id + '">'
      +   '<h4>' + (item.name || item.id) + '</h4>'
      +   parts
      +   priorityMeta
      + '</article>';
  }

  // Render one IA frame tree (Main menu / Sitemap / Footer) as a single collapsible
  // card. The row's `title` becomes the lvl-1 root node label; row.nodes[] becomes
  // the lvl-2+ content. `kind` is informational — `data-tree-kind` attribute is
  // emitted so downstream JS (filters, analytics) can discriminate.
  // Sitemap nodes carry `data-page-id` (joins to section-map page_sections);
  // main-menu/footer nodes carry `data-node-id` (avoids polluting page-id enumerators).
  function treeRowHtml(row) {
    const kind = row.kind || 'tree';
    const idAttr = kind === 'sitemap' ? 'data-page-id' : 'data-node-id';
    function nodeHtml(n, level) {
      const hasChildren = n.children && n.children.length;
      const toggleHtml = hasChildren
        ? '<button type="button" class="pp-tree-toggle" aria-label="Toggle"></button>'
        : '<span class="pp-tree-toggle pp-tree-toggle--spacer"></span>';
      const metaHtml = hasChildren
        ? '<span class="pp-tree-meta"><span class="pp-tree-hint">(' + n.children.length + ')</span></span>'
        : '';
      const idHtml = n.id ? ' ' + idAttr + '="' + n.id + '"' : '';
      const expandedHtml = hasChildren ? ' data-expanded="false"' : '';
      const childrenHtml = hasChildren
        ? '<ul class="pp-tree-children">' + n.children.map(function(c) { return nodeHtml(c, level + 1); }).join('') + '</ul>'
        : '';
      return ''
        + '<li class="pp-tree-node pp-tree-node--lvl' + level + '"' + idHtml + expandedHtml + '>'
        +   '<div class="pp-tree-row">'
        +     toggleHtml
        +     '<span class="pp-tree-name">' + (n.name || '') + '</span>'
        +     metaHtml
        +   '</div>'
        +   childrenHtml
        + '</li>';
    }
    const rootChildren = (row.nodes || []).map(function(n) { return nodeHtml(n, 2); }).join('');
    return ''
      + '<div class="pp-tree-card" data-tree-kind="' + kind + '">'
      +   '<ul class="pp-tree">'
      +     '<li class="pp-tree-node pp-tree-node--lvl1" data-expanded="false">'
      +       '<div class="pp-tree-row">'
      +         '<button type="button" class="pp-tree-toggle" aria-label="Toggle"></button>'
      +         '<span class="pp-tree-name">' + (row.title || '') + '</span>'
      +       '</div>'
      +       '<ul class="pp-tree-children">' + rootChildren + '</ul>'
      +     '</li>'
      +   '</ul>'
      + '</div>';
  }

  function pageMapHtml(row, data) {
    const pageEntry = (data.page_sections || []).find(function(p) { return p.page_id === row.page_id; }) || { name: row.page_id, goal: '', top_tasks_served: [] };
    const goalSeg  = pageEntry.goal ? metaSeg('Goal', pageEntry.goal) : '';
    const tasksSeg = listSeg('Top tasks', pageEntry.top_tasks_served);
    const header = ''
      + '<header class="pp-page-map__header">'
      +   '<div class="pp-page-map__title">' + (pageEntry.name || '') + '</div>'
      +   goalSeg
      +   tasksSeg
      + '</header>';
    const sectionItems = (data.items || []).filter(function(it) {
      return it.scope === 'section' && it.page_id === row.page_id;
    });
    // Section cards stack vertically on Section map — one column, section cards
    // carry multi-line content (Goal + Message + bullets + readiness pill).
    const variant = 'one';
    const cardsHtml = sectionItems.map(cardHtml).join('');
    return ''
      + '<section class="pp-page-map" data-page-id="' + row.page_id + '">'
      +   header
      +   '<div class="ui-card-row ui-card-row--' + variant + '">' + cardsHtml + '</div>'
      + '</section>';
  }

  function summaryHtml(summary, data) {
    if (!summary) return '';
    function stat(n, labelKey, fallback) {
      return '<div class="pp-summary__stat"><div class="pp-summary__n">' + (n != null ? n : '') + '</div><div class="pp-summary__label">' + (LABELS[labelKey] || fallback) + '</div></div>';
    }
    // Sections needing content = count of section_index entries whose
    // content_status is NOT content-ready. Derived (not persisted) because
    // it's a view over data the agent already wrote.
    const sections = (data && data.section_index) || [];
    const needingContent = summary.sections_needing_content != null
      ? summary.sections_needing_content
      : sections.filter(function(s) { return s.content_status && s.content_status !== 'content-ready'; }).length;
    return ''
      + '<div class="pp-summary">'
      +   stat(summary.total_templates,  'pp_inventory_total_templates',          'Unique templates')
      +   stat(summary.unique_sections,  'pp_inventory_unique_sections',          'Unique sections')
      +   stat(needingContent,           'pp_inventory_sections_needing_content', 'Sections needing content')
      + '</div>';
  }

  function templateArchHtml(template) {
    if (!template) return '';
    const kindLabelKey = 'template_' + String(template.template_type || '').replace(/-/g, '_');
    const kindLabel = LABELS[kindLabelKey] || template.template_type || '';
    const head = ''
      + '<div class="pp-template-arch__head">'
      +   '<h3 class="pp-template-arch__title">' + (template.name || template.id) + '</h3>'
      +   '<span class="pp-template-arch__kind">' + kindLabel + '</span>'
      + '</div>';
    const goalHtml = template.goal ? '<div class="pp-template-arch__goal">' + template.goal + '</div>' : '';

    const sectionById = {};
    (INVENTORY.section_index || []).forEach(function(s) { sectionById[s.id] = s; });
    function stackItem(id, i) {
      const s = sectionById[id];
      const name = s ? s.name : id;
      const narrative = s ? s.narrative : '';
      const narrativeChip = narrative ? plainChip(narrative) : '';
      return '<li><span><span class="pp-stack-n">' + (i + 1) + '</span>' + name + '</span>' + narrativeChip + '</li>';
    }

    let body = '';
    const t = template.template_type;
    if (t === 'standard') {
      body = '<ol class="pp-stack-list">' + (template.sections || []).map(stackItem).join('') + '</ol>';
    } else if (t === 'corporate-pool' || t === 'corporate_pool') {
      const sharedHtml = (template.shared_sections || []).map(stackItem).join('');
      const poolHtml = (template.pool_sections || []).map(function(p) {
        const usedBy = (p.used_by || []).map(plainChip).join('');
        return '<div class="pp-pool-card"><strong>' + (p.name || p.id) + '</strong><div class="pp-used-by">' + usedBy + '</div></div>';
      }).join('');
      body = ''
        + '<div class="pp-pool-subhead">' + (LABELS.pp_inventory_shared_sections || 'Shared sections') + '</div>'
        + '<ol class="pp-stack-list">' + sharedHtml + '</ol>'
        + '<div class="pp-pool-subhead">' + (LABELS.pp_inventory_pool_variants || 'Pool variants') + '</div>'
        + '<div class="pp-pool-gallery">' + poolHtml + '</div>';
    } else if (t === 'modular') {
      const atomsHtml = (template.atoms || []).map(plainChip).join('');
      body = '<div class="pp-atom-palette">' + atomsHtml + '</div>';
    }
    return '<div class="pp-template-arch" data-template-id="' + template.id + '">' + head + goalHtml + body + '</div>';
  }

  // ---- DOM refs ----
  const panel = document.getElementById('shellLeftpanel');
  const panelToggle = document.getElementById('shellPanelToggle');
  const panelBody = document.getElementById('shellLeftpanelBody');
  const panelHeader = document.getElementById('shellHeader');
  const panelFilterArea = document.getElementById('shellFilterArea');
  const backBtn = document.getElementById('shellBack');
  const pageTabs = document.getElementById('shellPageTabs');
  const navEl = document.getElementById('shellNav');
  const navPrevBtn = document.getElementById('shellNavPrev');
  const navNextBtn = document.getElementById('shellNavNext');
  const navCounter = document.getElementById('shellNavCounter');

  // ---- State ----
  let currentPage = 'context'; // 'context' | 'strategy' | 'inventory'
  let view = 'list';           // 'list' | 'detail'
  let navList = [];
  let navIndex = -1;
  let activeFilter = {};       // per-axis; reset on page change via resetFilter
  let filterExpanded = false;

  // ---- Per sub-page descriptors ----
  // Design plan (internal slug: 'inventory') derives its flat item list from section_index + template_map
  // (data is structural, not flat). Each derived item carries a `kind` so the
  // left panel can group by Sections vs. Templates.
  const _INVENTORY_ITEMS = (function() {
    const fromSections = (INVENTORY.section_index || []).map(function(s) {
      return Object.assign({}, s, { kind: 'section', title: s.name });
    });
    const fromTemplates = (INVENTORY.template_map || []).map(function(t) {
      return Object.assign({}, t, { kind: 'template', title: t.name });
    });
    return fromSections.concat(fromTemplates);
  })();

  // Build a dynamic page_id → label map from the Section map's page_sections.
  // Used by the `page_id` filter axis on the Section map sub-page. Rebuilt
  // once at module init since page_sections is static per deliverable.
  const PAGE_ID_MAP = (function() {
    const m = {};
    (SECTION_MAP.page_sections || []).forEach(function(p) {
      m[p.page_id] = { label: (p.page_id === 'global' ? (LABELS.page_global_label || p.name) : p.name), cls: 'ui-badge--gray' };
    });
    return m;
  })();
  const PAGE_ID_VALUES = Object.keys(PAGE_ID_MAP);

  function itemsForPage(page) {
    if (page === 'context')     return CONTEXT.items || [];
    if (page === 'strategy')    return STRATEGY.items || [];
    if (page === 'section-map') return SECTION_MAP.items || [];
    if (page === 'inventory')   return _INVENTORY_ITEMS;
    return [];
  }
  function axesForPage(page) {
    if (page === 'context')     return ['group', 'confidence'];
    if (page === 'strategy')    return ['scope', 'confidence'];
    if (page === 'section-map') return ['page_id', 'confidence'];
    if (page === 'inventory')   return ['priority_tier', 'template_type'];
    return [];
  }
  function axisOptionsForPage(page) {
    if (page === 'context')     return { group: ['universal', 'project-specific'], confidence: ['high', 'medium', 'low'] };
    if (page === 'strategy')    return { scope: ['page', 'section', 'ia'], confidence: ['high', 'medium', 'low'] };
    if (page === 'section-map') return { page_id: PAGE_ID_VALUES, confidence: ['high', 'medium', 'low'] };
    if (page === 'inventory')   return { priority_tier: ['critical', 'significant', 'minor'], template_type: ['standard', 'corporate-pool', 'modular'] };
    return {};
  }
  function mapForAxis(axis) {
    return { group: GROUP_MAP, confidence: CONF_MAP, scope: SCOPE_MAP, page_id: PAGE_ID_MAP, priority_tier: PRIORITY_MAP, template_type: TEMPLATE_TYPE_MAP }[axis];
  }
  function axisLabel(axis) {
    return { group: LABELS.axis_group, confidence: LABELS.axis_confidence, scope: LABELS.axis_scope, page_id: LABELS.axis_page, priority_tier: LABELS.axis_priority, template_type: LABELS.axis_template_type }[axis];
  }
  function resetFilter(page) {
    activeFilter = {};
    axesForPage(page).forEach(function(a) { activeFilter[a] = []; });
  }
  function matchesFilter(item) {
    const axes = axesForPage(currentPage);
    return axes.every(function(a) {
      const sel = activeFilter[a] || [];
      if (!sel.length) return true;
      return sel.indexOf(item[a]) !== -1;
    });
  }
  function pillForItem(item) {
    if (currentPage === 'context') {
      return (item.group ? pill(GROUP_MAP, item.group) : '')
        + (item.confidence ? pill(CONF_MAP, item.confidence) : '');
    }
    if (currentPage === 'strategy') {
      return (item.scope ? pill(SCOPE_MAP, item.scope) : '')
        + (item.confidence ? pill(CONF_MAP, item.confidence) : '');
    }
    if (currentPage === 'section-map') {
      return (item.page_id ? pill(PAGE_ID_MAP, item.page_id) : '')
        + (item.confidence ? pill(CONF_MAP, item.confidence) : '');
    }
    if (currentPage === 'inventory') {
      return (item.priority_tier ? pill(PRIORITY_MAP, item.priority_tier) : '')
        + (item.template_type ? pill(TEMPLATE_TYPE_MAP, item.template_type) : '');
    }
    return '';
  }
  function metaRowsForItem(item) {
    const rows = [];
    if (currentPage === 'context') {
      // Context cards drop Group + Confidence meta rows — the group already
      // establishes the tier (universal / project-specific) via the list
      // grouping, and confidence already shows as a pill on the canvas card.
    } else if (currentPage === 'strategy') {
      if (item.scope)      rows.push('<dt>' + LABELS.axis_scope + '</dt><dd>' + pill(SCOPE_MAP, item.scope) + '</dd>');
      if (item.confidence) rows.push('<dt>' + LABELS.axis_confidence + '</dt><dd>' + pill(CONF_MAP, item.confidence) + '</dd>');
    } else if (currentPage === 'section-map') {
      if (item.page_id)    rows.push('<dt>' + LABELS.axis_page + '</dt><dd>' + pill(PAGE_ID_MAP, item.page_id) + '</dd>');
      if (item.confidence) rows.push('<dt>' + LABELS.axis_confidence + '</dt><dd>' + pill(CONF_MAP, item.confidence) + '</dd>');
    } else if (currentPage === 'inventory') {
      if (item.priority_tier) rows.push('<dt>' + LABELS.axis_priority + '</dt><dd>' + pill(PRIORITY_MAP, item.priority_tier) + '</dd>');
      if (item.template_type) rows.push('<dt>' + LABELS.axis_template_type + '</dt><dd>' + pill(TEMPLATE_TYPE_MAP, item.template_type) + '</dd>');
    }
    return rows.join('');
  }

  // ---- Panel open/close ----
  function openPanel() {
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    document.body.classList.add('shell-leftpanel-open');
    if (panelToggle) panelToggle.classList.add('is-active');
    try { localStorage.setItem(NS + '-panel-open', '1'); } catch (e) {}
  }
  function closePanel() {
    panel.classList.remove('is-open');
    panel.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('shell-leftpanel-open');
    if (panelToggle) panelToggle.classList.remove('is-active');
    try { localStorage.setItem(NS + '-panel-open', '0'); } catch (e) {}
    collapseAllTreeZones();
  }

  // Collapse every lvl-1 tree-card (Main menu / Sitemap / Footer) and clear
  // any tree-row selection. Used to keep tree-card state in lockstep with
  // the panel — opening one zone closes the rest; closing the panel
  // collapses all zones; switching the active canvas card collapses them
  // too (setActiveCanvasCard below).
  function collapseAllTreeZones() {
    document.querySelectorAll('.pp-tree-card .pp-tree-node--lvl1[data-expanded="true"]').forEach(function(n) {
      n.setAttribute('data-expanded', 'false');
    });
    document.querySelectorAll('.pp-tree-row.is-selected').forEach(function(r) {
      r.classList.remove('is-selected');
    });
  }
  function togglePanel() {
    if (panel.classList.contains('is-open')) closePanel(); else openPanel();
  }

  // ---- Filter chips — shared across sub-pages. Each sub-page's axes come
  // from axesForPage(); values from axisOptionsForPage(); pill label/color
  // from mapForAxis(). OR-logic within an axis, AND across axes (same as
  // audit-template). ----
  function renderFilterChips() {
    const axes = axesForPage(currentPage);
    if (!axes.length) { panelFilterArea.innerHTML = ''; return; }
    const options = axisOptionsForPage(currentPage);
    const allItems = itemsForPage(currentPage);

    function countForValue(axis, value) {
      return allItems.filter(function(it) { return it[axis] === value; }).length;
    }
    function chipRow(axis) {
      const sel = activeFilter[axis] || [];
      const map = mapForAxis(axis);
      const pieces = [
        '<button class="shell-chip' + (sel.length === 0 ? ' is-active' : '') + '" data-filter-axis="' + axis + '" data-filter-value="__all" type="button">' + LABELS.filter_all + '<span class="shell-chip-count">' + allItems.length + '</span></button>'
      ];
      (options[axis] || []).forEach(function(value) {
        const isActive = sel.indexOf(value) !== -1;
        const label = (map && map[value]) ? map[value].label : value;
        pieces.push('<button class="shell-chip' + (isActive ? ' is-active' : '') + '" data-filter-axis="' + axis + '" data-filter-value="' + value + '" type="button">' + label + '<span class="shell-chip-count">' + countForValue(axis, value) + '</span></button>');
      });
      return ''
        + '<div class="shell-filter-section">'
        +   '<div class="shell-filter-section__label">' + axisLabel(axis) + '</div>'
        +   '<div class="shell-filter-section__chips">' + pieces.join('') + '</div>'
        + '</div>';
    }

    const activeCount = axes.reduce(function(n, a) { return n + (activeFilter[a] || []).length; }, 0);
    const filterLabel = activeCount === 0 ? LABELS.filter_label : tpl('filter_label_active', { n: activeCount });
    const clearBtn = activeCount > 0
      ? '<button class="shell-filter-clear" id="shellFilterClear" type="button">' + LABELS.filter_clear + '</button>'
      : '';
    const sectionsHTML = axes.map(chipRow).join('');

    panelFilterArea.innerHTML = ''
      + '<div class="shell-filter-row">'
      +   '<button class="shell-filter-toggle' + (filterExpanded ? ' is-open' : '') + '" id="shellFilterToggle" type="button">'
      +     '<span>' + filterLabel + '</span>'
      +     '<span class="shell-filter-toggle__icon">' + (filterExpanded ? '−' : '+') + '</span>'
      +   '</button>'
      +   clearBtn
      + '</div>'
      + '<div class="shell-leftpanel__filter' + (filterExpanded ? '' : ' is-collapsed') + '" id="shellFilter">' + sectionsHTML + '</div>';
  }

  // ---- Project context list — grouped by tier (Universal / Project-specific). ----
  function renderContextList() {
    view = 'list';
    panelHeader.style.display = 'none';
    panelFilterArea.style.display = '';
    document.body.classList.remove('shell-detail-open');
    setActiveCanvasCard(null);

    renderFilterChips();

    const items = itemsForPage('context').filter(matchesFilter).filter(hasDetail);
    const groups = [
      { key: 'universal',        label: LABELS.group_universal },
      { key: 'project-specific', label: LABELS.group_project_specific }
    ];
    const groupsHTML = groups.map(function(g) {
      const groupItems = items.filter(function(it) { return it.group === g.key; });
      if (!groupItems.length) return '';
      const listHTML = groupItems.map(function(item, idx) {
        const labels = pill(GROUP_MAP, item.group) + (item.confidence ? pill(CONF_MAP, item.confidence) : '');
        return ''
          + '<div class="shell-item" data-id="' + item.id + '">'
          +   '<div class="shell-item__row">'
          +     '<span class="shell-item__n">#' + (idx + 1) + '</span>'
          +     '<h4 class="shell-item__title">' + (item.title || item.id) + '</h4>'
          +     '<span class="shell-item__labels">' + labels + '</span>'
          +   '</div>'
          + '</div>';
      }).join('');
      return '<div class="shell-group" data-group="' + g.key + '"><h4 class="shell-group-header">' + g.label + ' (' + groupItems.length + ')</h4><div class="shell-list">' + listHTML + '</div></div>';
    }).join('');
    const emptyHTML = '<div class="shell-empty">' + LABELS.group_empty + '</div>';

    panelBody.innerHTML = groupsHTML || emptyHTML;
  }

  // ---- Project context detail — rationale + alternatives (both live in the panel). ----
  function renderContextDetail(id) {
    view = 'detail';
    panelHeader.style.display = '';
    panelFilterArea.style.display = 'none';
    panelFilterArea.innerHTML = '';
    if (backBtn) backBtn.style.display = 'inline-block';
    if (navEl) navEl.style.display = 'flex';
    document.body.classList.add('shell-detail-open');

    const item = (itemsForPage('context')).find(function(x) { return x.id === id; });
    if (!item) return;
    setActiveCanvasCard(id);

    const meta = metaRowsForItem(item);
    const blocks = [];
    if (item.rationale) {
      blocks.push('<div class="shell-detail__block"><h4 class="shell-detail__label">' + LABELS.detail_rationale + '</h4><p class="shell-detail__text">' + item.rationale + '</p></div>');
    }
    if (item.alternatives) {
      blocks.push('<div class="shell-detail__block"><h4 class="shell-detail__label">' + LABELS.detail_alternatives + '</h4><p class="shell-detail__text">' + item.alternatives + '</p></div>');
    }
    const blocksHTML = blocks.length ? '<div class="shell-detail__blocks">' + blocks.join('') + '</div>' : '';

    panelBody.innerHTML = ''
      + '<h3 class="shell-detail__title">' + (item.title || item.id) + '</h3>'
      + (meta ? '<dl class="shell-detail__meta">' + meta + '</dl>' : '')
      + blocksHTML;
    updateNavCounter();
  }

  // Highlight the canvas card matching the currently-open detail item. Pass
  // null to clear. Scoped to the active sub-page so cross-sub-page state
  // never lingers after a page switch.
  function setActiveCanvasCard(id) {
    document.querySelectorAll('.pp-page .ui-card.is-active').forEach(function(el) {
      el.classList.remove('is-active');
    });
    // Any shift in canvas-card focus (to list, or to a different card) also
    // collapses the IA-frame tree zones — selection/expand state stays in
    // lockstep with the panel target.
    collapseAllTreeZones();
    if (id == null) return;
    const activePage = document.querySelector('.pp-page--active');
    if (!activePage) return;
    const card = activePage.querySelector('.ui-card[data-id="' + id + '"]');
    if (card) card.classList.add('is-active');
  }

  // ---- Project plan list — groups by scope (page / section / ia). IA decisions
  // live only in the panel list (no canvas card); section items
  // show their page label so users can see which page each section belongs to. ----
  function renderStrategyList() {
    view = 'list';
    panelHeader.style.display = 'none';
    panelFilterArea.style.display = '';
    document.body.classList.remove('shell-detail-open');
    setActiveCanvasCard(null);

    renderFilterChips();

    const items = itemsForPage('strategy').filter(matchesFilter).filter(hasDetail);

    // Project strategy only carries page + ia scope items after the v4.0 split —
    // section-scope items moved to the Section map sub-page (#section-map-data).
    const scopeGroups = [
      { key: 'page', label: LABELS.group_scope_page },
      { key: 'ia',   label: LABELS.group_scope_ia }
    ];
    const groupsHTML = scopeGroups.map(function(g) {
      const groupItems = items.filter(function(it) { return it.scope === g.key; });
      if (!groupItems.length) return '';
      const listHTML = groupItems.map(function(item, idx) {
        const pills = pill(SCOPE_MAP, item.scope) + (item.confidence ? pill(CONF_MAP, item.confidence) : '');
        const pageNote = (item.scope === 'ia' && item.element)
          ? '<div class="shell-item__page-note"><strong>' + LABELS.detail_element + ':</strong> ' + item.element + '</div>'
          : '';
        return ''
          + '<div class="shell-item" data-id="' + item.id + '">'
          +   '<div class="shell-item__row">'
          +     '<span class="shell-item__n">#' + (idx + 1) + '</span>'
          +     '<h4 class="shell-item__title">' + (item.title || item.id) + '</h4>'
          +     '<span class="shell-item__labels">' + pills + '</span>'
          +   '</div>'
          +   pageNote
          + '</div>';
      }).join('');
      return '<div class="shell-group" data-group="scope-' + g.key + '"><h4 class="shell-group-header">' + g.label + ' (' + groupItems.length + ')</h4><div class="shell-list">' + listHTML + '</div></div>';
    }).join('');
    const emptyHTML = '<div class="shell-empty">' + LABELS.group_empty + '</div>';

    panelBody.innerHTML = groupsHTML || emptyHTML;
  }

  // ---- Section map list — groups sections by page (Home / Product / Global).
  // The virtual Global page appears as its own group. Page order
  // follows page_sections[] declaration order. ----
  function renderSectionMapList() {
    view = 'list';
    panelHeader.style.display = 'none';
    panelFilterArea.style.display = '';
    document.body.classList.remove('shell-detail-open');
    setActiveCanvasCard(null);

    renderFilterChips();

    const items = itemsForPage('section-map').filter(matchesFilter).filter(hasDetail);
    const pageSections = SECTION_MAP.page_sections || [];

    const groupsHTML = pageSections.map(function(p) {
      const groupItems = items.filter(function(it) { return it.page_id === p.page_id; });
      if (!groupItems.length) return '';
      const pageLabel = p.page_id === 'global' ? (LABELS.page_global_label || p.name) : p.name;
      const listHTML = groupItems.map(function(item, idx) {
        const pills = (item.narrative ? narrativeTag(item.narrative) : '')
          + (item.confidence ? pill(CONF_MAP, item.confidence) : '');
        return ''
          + '<div class="shell-item" data-id="' + item.id + '">'
          +   '<div class="shell-item__row">'
          +     '<span class="shell-item__n">#' + (idx + 1) + '</span>'
          +     '<h4 class="shell-item__title">' + (item.title || item.id) + '</h4>'
          +     '<span class="shell-item__labels">' + pills + '</span>'
          +   '</div>'
          + '</div>';
      }).join('');
      return '<div class="shell-group" data-group="page-' + p.page_id + '"><h4 class="shell-group-header">' + pageLabel + ' (' + groupItems.length + ')</h4><div class="shell-list">' + listHTML + '</div></div>';
    }).join('');
    const emptyHTML = '<div class="shell-empty">' + LABELS.group_empty + '</div>';

    panelBody.innerHTML = groupsHTML || emptyHTML;
  }

  // ---- Project strategy detail — rationale + alternatives only. IA-scope
  // items add element + decision_status since IA decisions never render on
  // the canvas (panel-only). All other fields already live on the
  // card; repeating them here is redundant. ----
  function renderStrategyDetail(id) {
    view = 'detail';
    panelHeader.style.display = '';
    panelFilterArea.style.display = 'none';
    panelFilterArea.innerHTML = '';
    if (backBtn) backBtn.style.display = 'inline-block';
    if (navEl) navEl.style.display = 'flex';
    document.body.classList.add('shell-detail-open');

    const item = (itemsForPage('strategy')).find(function(x) { return x.id === id; });
    if (!item) return;
    setActiveCanvasCard(id);

    const metaRows = [];
    if (item.scope === 'ia' && item.element)         metaRows.push('<dt>' + LABELS.detail_element + '</dt><dd>' + item.element + '</dd>');
    if (item.scope === 'ia' && item.decision_status) metaRows.push('<dt>' + LABELS.detail_decision_status + '</dt><dd>' + item.decision_status + '</dd>');
    const meta = metaRows.join('');

    const blocks = [];
    if (item.rationale)    blocks.push(detailBlock(LABELS.detail_rationale, item.rationale));
    if (item.alternatives) blocks.push(detailBlock(LABELS.detail_alternatives, item.alternatives));
    const blocksHTML = blocks.length ? '<div class="shell-detail__blocks">' + blocks.join('') + '</div>' : '';

    panelBody.innerHTML = ''
      + '<h3 class="shell-detail__title">' + (item.title || item.id) + '</h3>'
      + (meta ? '<dl class="shell-detail__meta">' + meta + '</dl>' : '')
      + blocksHTML;
    updateNavCounter();
  }

  // ---- Section map detail — rationale + alternatives only. Section card
  // fields (Goal / Message / Readiness / Content) are already on the canvas
  // card; repeating them in the panel is redundant. ----
  function renderSectionMapDetail(id) {
    view = 'detail';
    panelHeader.style.display = '';
    panelFilterArea.style.display = 'none';
    panelFilterArea.innerHTML = '';
    if (backBtn) backBtn.style.display = 'inline-block';
    if (navEl) navEl.style.display = 'flex';
    document.body.classList.add('shell-detail-open');

    const item = (itemsForPage('section-map')).find(function(x) { return x.id === id; });
    if (!item) return;
    setActiveCanvasCard(id);

    const blocks = [];
    if (item.rationale)    blocks.push(detailBlock(LABELS.detail_rationale, item.rationale));
    if (item.alternatives) blocks.push(detailBlock(LABELS.detail_alternatives, item.alternatives));
    const blocksHTML = blocks.length ? '<div class="shell-detail__blocks">' + blocks.join('') + '</div>' : '';

    panelBody.innerHTML = ''
      + '<h3 class="shell-detail__title">' + (item.title || item.id) + '</h3>'
      + blocksHTML;
    updateNavCounter();
  }

  function detailBlock(label, text) {
    return '<div class="shell-detail__block"><h4 class="shell-detail__label">' + label + '</h4><p class="shell-detail__text">' + text + '</p></div>';
  }

  // ---- Design plan list — groups by kind (Sections / Templates). Templates
  // don't have a priority_tier, so the priority_tier filter naturally narrows
  // to sections when active; template_type filter applies to both. ----
  function renderInventoryList() {
    view = 'list';
    panelHeader.style.display = 'none';
    panelFilterArea.style.display = '';
    document.body.classList.remove('shell-detail-open');
    setActiveCanvasCard(null);

    renderFilterChips();

    const items = itemsForPage('inventory').filter(matchesFilter).filter(hasDetail);
    const kindGroups = [
      { key: 'section',  label: LABELS.group_kind_section },
      { key: 'template', label: LABELS.group_kind_template }
    ];
    const groupsHTML = kindGroups.map(function(g) {
      const groupItems = items.filter(function(it) { return it.kind === g.key; });
      if (!groupItems.length) return '';
      const listHTML = groupItems.map(function(item, idx) {
        const priorityPill  = item.priority_tier ? pill(PRIORITY_MAP, item.priority_tier) : '';
        const templatePill  = item.template_type ? pill(TEMPLATE_TYPE_MAP, item.template_type) : '';
        return ''
          + '<div class="shell-item" data-id="' + item.id + '">'
          +   '<div class="shell-item__row">'
          +     '<span class="shell-item__n">#' + (idx + 1) + '</span>'
          +     '<h4 class="shell-item__title">' + (item.title || item.id) + '</h4>'
          +     '<span class="shell-item__labels">' + priorityPill + templatePill + '</span>'
          +   '</div>'
          + '</div>';
      }).join('');
      return '<div class="shell-group" data-group="kind-' + g.key + '"><h4 class="shell-group-header">' + g.label + ' (' + groupItems.length + ')</h4><div class="shell-list">' + listHTML + '</div></div>';
    }).join('');
    const emptyHTML = '<div class="shell-empty">' + LABELS.group_empty + '</div>';

    panelBody.innerHTML = groupsHTML || emptyHTML;
  }

  // ---- Design plan detail — rationale + alternatives only. Priority /
  // usage / used-in / atoms / variants / goal / key_message / narrative
  // all live on the canvas card already. Panel surfaces only the "why". ----
  function renderInventoryDetail(id) {
    view = 'detail';
    panelHeader.style.display = '';
    panelFilterArea.style.display = 'none';
    panelFilterArea.innerHTML = '';
    if (backBtn) backBtn.style.display = 'inline-block';
    if (navEl) navEl.style.display = 'flex';
    document.body.classList.add('shell-detail-open');

    const item = (itemsForPage('inventory')).find(function(x) { return x.id === id; });
    if (!item) return;
    setActiveCanvasCard(id);

    const blocks = [];
    if (item.rationale)    blocks.push(detailBlock(LABELS.detail_rationale, item.rationale));
    if (item.alternatives) blocks.push(detailBlock(LABELS.detail_alternatives, item.alternatives));
    const blocksHTML = blocks.length ? '<div class="shell-detail__blocks">' + blocks.join('') + '</div>' : '';

    panelBody.innerHTML = ''
      + '<h3 class="shell-detail__title">' + (item.title || item.id) + '</h3>'
      + blocksHTML;
    updateNavCounter();
  }

  // ---- Generic list/detail router — dispatches to sub-page-specific
  // implementations. Every sub-page now has a dedicated implementation. ----
  function renderList() {
    if (currentPage === 'context')     return renderContextList();
    if (currentPage === 'strategy')    return renderStrategyList();
    if (currentPage === 'section-map') return renderSectionMapList();
    if (currentPage === 'inventory')   return renderInventoryList();
  }

  function renderDetail(id) {
    if (currentPage === 'context')     return renderContextDetail(id);
    if (currentPage === 'strategy')    return renderStrategyDetail(id);
    if (currentPage === 'section-map') return renderSectionMapDetail(id);
    if (currentPage === 'inventory')   return renderInventoryDetail(id);
  }

  // ---- Nav counter (prev/next within current sub-page list) ----
  // Capture from DATA (filtered by activeFilter), not DOM — so detail-view
  // navigation works even when the panel body is showing detail markup and
  // card-click-to-detail captures a fresh list regardless of panel state.
  function captureNavList() {
    navList = itemsForPage(currentPage).filter(matchesFilter).filter(hasDetail).map(function(it) { return { id: it.id }; });
  }
  function updateNavCounter() {
    if (!navList.length) {
      if (navCounter) navCounter.textContent = LABELS.nav_counter_empty;
      if (navPrevBtn) navPrevBtn.disabled = true;
      if (navNextBtn) navNextBtn.disabled = true;
      return;
    }
    if (navCounter) navCounter.textContent = tpl('nav_counter', { i: navIndex + 1, total: navList.length });
    if (navPrevBtn) navPrevBtn.disabled = navIndex <= 0;
    if (navNextBtn) navNextBtn.disabled = navIndex >= navList.length - 1;
  }
  function goPrev() {
    if (navIndex > 0) { navIndex--; renderDetail(navList[navIndex].id); }
  }
  function goNext() {
    if (navIndex < navList.length - 1) { navIndex++; renderDetail(navList[navIndex].id); }
  }

  // ---- Page switcher ----
  function activatePage(slug) {
    if (VISIBLE_PAGES.indexOf(slug) === -1) return;
    currentPage = slug;
    resetFilter(slug);
    filterExpanded = false;
    const pages = document.querySelectorAll('.pp-page');
    pages.forEach(function(p) {
      p.classList.toggle('pp-page--active', p.id === 'pp-page-' + slug);
    });
    if (pageTabs) {
      pageTabs.querySelectorAll('.shell-bottombar__btn').forEach(function(btn) {
        btn.classList.toggle('is-active', btn.getAttribute('data-page') === slug);
      });
    }
    // Always return to list view on sub-page change so users start from overview.
    renderList();
  }

  // ---- Event wiring ----
  if (panelToggle) panelToggle.addEventListener('click', togglePanel);

  if (pageTabs) {
    pageTabs.addEventListener('click', function(e) {
      const btn = e.target.closest('.shell-bottombar__btn[data-page]');
      if (!btn) return;
      const slug = btn.getAttribute('data-page');
      activatePage(slug);
      location.hash = '#' + slug;
    });
    window.addEventListener('hashchange', function() {
      const slug = (location.hash || '').slice(1);
      if (VISIBLE_PAGES.indexOf(slug) !== -1) activatePage(slug);
    });
  }

  panelBody.addEventListener('click', function(e) {
    const item = e.target.closest('.shell-item');
    if (item) {
      captureNavList();
      navIndex = navList.findIndex(function(x) { return x.id === item.dataset.id; });
      renderDetail(item.dataset.id);
    }
  });

  // Filter chip delegation — clear / toggle expand / axis chips. Separate from
  // panelBody handler because filter chrome lives in panelFilterArea (above the
  // scrollable list body).
  panelFilterArea.addEventListener('click', function(e) {
    const clearBtn = e.target.closest('#shellFilterClear');
    if (clearBtn) {
      resetFilter(currentPage);
      renderList();
      return;
    }
    const toggleBtn = e.target.closest('#shellFilterToggle');
    if (toggleBtn) {
      filterExpanded = !filterExpanded;
      renderList();
      return;
    }
    const chip = e.target.closest('.shell-chip');
    if (chip) {
      const axis = chip.dataset.filterAxis;
      const value = chip.dataset.filterValue;
      if (!axis) return;
      if (value === '__all') {
        activeFilter[axis] = [];
      } else {
        const arr = activeFilter[axis] || (activeFilter[axis] = []);
        const idx = arr.indexOf(value);
        if (idx === -1) arr.push(value);
        else arr.splice(idx, 1);
      }
      renderList();
    }
  });

  // Canvas card clicks → open panel + render detail for the matching data
  // item. Delegated on .pp-main so cards across all three sub-pages (Project
  // context / Project plan / Design plan) participate automatically.
  const ppMain = document.querySelector('.pp-main');
  if (ppMain) {
    ppMain.addEventListener('click', function(e) {
      const card = e.target.closest('.ui-card[data-id]:not(.ui-card--no-detail)');
      if (!card) return;
      const id = card.dataset.id;
      // Second click on the same (currently-open) card closes the detail view.
      if (view === 'detail' && card.classList.contains('is-active')) {
        renderList();
        return;
      }
      openPanel();
      captureNavList();
      navIndex = navList.findIndex(function(x) { return x.id === id; });
      renderDetail(id);
    });
  }

  if (backBtn) backBtn.addEventListener('click', function() {
    if (view === 'detail') renderList();
  });
  if (navPrevBtn) navPrevBtn.addEventListener('click', goPrev);
  if (navNextBtn) navNextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && panel.classList.contains('is-open')) {
      if (view === 'detail') renderList();
      else closePanel();
    }
  });

  // ============================================================
  // MD export — four sub-page formatters + HTML downloader.
  // Each formatter follows the shared convention from
  // references/shared/interactive-deliverable-shell.md §MD export
  // convention: format{Doc}Md(data) → { md, filename }. Filenames
  // derive from NS inside the formatter so there is one place to
  // change them.
  // ============================================================

  function _md_stripBraces(v) {
    var s = (v == null) ? '' : String(v);
    return (s.length >= 2 && s.charAt(0) === '{' && s.charAt(s.length - 1) === '}') ? s.slice(1, -1) : s;
  }
  function _md_confidenceLabel(c) {
    if (c === 'high')   return LABELS.md_confidence_confirmed;
    if (c === 'medium') return LABELS.md_confidence_likely;
    if (c === 'low')    return LABELS.md_confidence_tentative;
    return c || '';
  }
  function _md_priorityLabel(p) {
    if (p === 'critical')    return LABELS.priority_critical;
    if (p === 'significant') return LABELS.priority_significant;
    if (p === 'minor')       return LABELS.priority_minor;
    return p || '';
  }
  function _md_templateTypeLabel(t) {
    if (t === 'standard')       return LABELS.template_standard;
    if (t === 'corporate-pool') return LABELS.template_corporate_pool;
    if (t === 'modular')        return LABELS.template_modular;
    return t || '';
  }
  function _md_contentStatusLabel(s) {
    if (s === 'content-ready') return LABELS.pp_content_ready;
    if (s === 'needs-content') return LABELS.pp_needs_content;
    if (s === 'tbd')           return LABELS.pp_tbd_status;
    return s || '';
  }
  function _md_joinChips(arr) {
    if (!arr || !arr.length) return '';
    return arr.map(_md_stripBraces).join(', ');
  }
  // Render the body of one card (layout-specific fields + confidence + meta_pills + rationale + alternatives).
  // Title / heading is emitted by the caller so context- and strategy-card sections can share this body.
  function _md_renderCardBody(item) {
    var lines = [];
    if (item.lead) lines.push(_md_stripBraces(item.lead), '');
    if (item.body) lines.push(_md_stripBraces(item.body), '');
    if (item.kv && item.kv.length) {
      item.kv.forEach(function(entry) {
        var label = _md_stripBraces(entry.label);
        var value = _md_stripBraces(entry.value);
        lines.push('- **' + label + ':** ' + value);
      });
      lines.push('');
    }
    if (item.bullets && item.bullets.length) {
      item.bullets.forEach(function(b) { lines.push('- ' + _md_stripBraces(b)); });
      lines.push('');
    }
    if (item.ranked && item.ranked.length) {
      item.ranked.forEach(function(entry, i) {
        var text = _md_stripBraces(entry.text);
        var suffix = entry.priority ? ' (' + _md_stripBraces(entry.priority) + ')' : '';
        lines.push((i + 1) + '. ' + text + suffix);
      });
      lines.push('');
    }
    if (item.chips && item.chips.length) {
      item.chips.forEach(function(c) { lines.push('- ' + _md_stripBraces(c)); });
      lines.push('');
    }
    if (item.scope_split) {
      var inc = (item.scope_split.included || []).map(_md_stripBraces);
      var exc = (item.scope_split.excluded || []).map(_md_stripBraces);
      if (inc.length) lines.push('**' + LABELS.md_included + ':** ' + inc.join(', '));
      if (exc.length) lines.push('**' + LABELS.md_excluded + ':** ' + exc.join(', '));
      if (inc.length || exc.length) lines.push('');
    }
    if (item.confidence) {
      lines.push('**' + LABELS.md_confidence + ':** ' + _md_confidenceLabel(item.confidence));
    }
    if (item.meta_pills && item.meta_pills.length) {
      lines.push('**' + LABELS.md_meta_pills + ':** ' + _md_joinChips(item.meta_pills));
    }
    if (item.rationale) {
      lines.push('', '**' + LABELS.md_rationale + ':**', '', _md_stripBraces(item.rationale));
    }
    if (item.alternatives) {
      lines.push('', '**' + LABELS.md_alternatives + ':**', '', _md_stripBraces(item.alternatives));
    }
    return lines.join('\n').replace(/\n+$/, '');
  }
  // Walk a tree of `{ id?, name, children[] }` nodes into a Markdown bullet list.
  function _md_renderTree(nodes, depth) {
    if (!nodes || !nodes.length) return '';
    var indent = new Array((depth || 0) + 1).join('  ');
    var out = [];
    nodes.forEach(function(n) {
      out.push(indent + '- ' + _md_stripBraces(n.name || n.id || ''));
      if (n.children && n.children.length) {
        out.push(_md_renderTree(n.children, (depth || 0) + 1));
      }
    });
    return out.join('\n');
  }

  // ---- Document-level formatters (per shared convention).
  // Contract: format{Doc}Md(data) → { md: string, filename: string }.

  function formatContextMd(data) {
    data = data || CONTEXT;
    var parts = ['# ' + LABELS.md_pp_context_title, ''];
    var byId = {};
    (data.items || []).forEach(function(it) { byId[it.id] = it; });
    var rows = (data.canvas && data.canvas.rows) || [];
    rows.forEach(function(row) {
      if (row.type !== 'cards') return;
      if (row.title) parts.push('## ' + _md_stripBraces(row.title), '');
      (row.card_ids || []).forEach(function(id) {
        var it = byId[id];
        if (!it) return;
        parts.push('### ' + _md_stripBraces(it.title || id), '');
        var body = _md_renderCardBody(it);
        if (body) parts.push(body, '');
        parts.push('---', '');
      });
    });
    return { md: parts.join('\n').replace(/\n+$/, '\n'), filename: NS + '-project-context.md' };
  }

  function formatStrategyMd(data) {
    data = data || STRATEGY;
    var parts = ['# ' + LABELS.md_pp_strategy_title, ''];
    var byId = {};
    (data.items || []).forEach(function(it) { byId[it.id] = it; });
    var rows = (data.canvas && data.canvas.rows) || [];
    rows.forEach(function(row) {
      if (row.type === 'cards') {
        if (row.title) parts.push('## ' + _md_stripBraces(row.title), '');
        (row.card_ids || []).forEach(function(id) {
          var it = byId[id];
          if (!it) return;
          parts.push('### ' + _md_stripBraces(it.title || id), '');
          var body = _md_renderCardBody(it);
          if (body) parts.push(body, '');
          parts.push('---', '');
        });
      } else if (row.type === 'heading') {
        if (row.title) parts.push('## ' + _md_stripBraces(row.title), '');
      } else if (row.type === 'tree' || row.type === 'sitemap') {
        var kind = row.kind || (row.type === 'sitemap' ? 'sitemap' : null);
        var nodes = row.nodes || (row.nodes_ref ? data[row.nodes_ref] : null) || [];
        var title = row.title ? _md_stripBraces(row.title) : (kind || '');
        parts.push('## ' + title, '');
        var meta = (kind === 'sitemap'   && data.sitemap_meta)   ? data.sitemap_meta
                 : (kind === 'main-menu' && data.main_menu_meta) ? data.main_menu_meta
                 : (kind === 'footer'    && data.footer_meta)    ? data.footer_meta
                 : null;
        var tree = _md_renderTree(nodes, 0);
        if (tree) parts.push(tree, '');
        if (meta && meta.rationale) {
          parts.push('**' + LABELS.md_rationale + ':**', '', _md_stripBraces(meta.rationale), '');
        }
        if (meta && meta.alternatives) {
          parts.push('**' + LABELS.md_alternatives + ':**', '', _md_stripBraces(meta.alternatives), '');
        }
        parts.push('---', '');
      }
    });
    var iaItems = (data.items || []).filter(function(it) { return it.scope === 'ia'; });
    if (iaItems.length) {
      parts.push('## ' + LABELS.md_strategy_section_ia, '');
      iaItems.forEach(function(it) {
        parts.push('### ' + _md_stripBraces(it.title || it.id), '');
        if (it.element)         parts.push('- **' + LABELS.md_element + ':** ' + _md_stripBraces(it.element));
        if (it.decision_status) parts.push('- **' + LABELS.md_decision_status + ':** ' + _md_stripBraces(it.decision_status));
        if (it.confidence)      parts.push('- **' + LABELS.md_confidence + ':** ' + _md_confidenceLabel(it.confidence));
        parts.push('');
        if (it.rationale) {
          parts.push('**' + LABELS.md_rationale + ':**', '', _md_stripBraces(it.rationale), '');
        }
        if (it.alternatives) {
          parts.push('**' + LABELS.md_alternatives + ':**', '', _md_stripBraces(it.alternatives), '');
        }
        parts.push('---', '');
      });
    }
    return { md: parts.join('\n').replace(/\n+$/, '\n'), filename: NS + '-project-strategy.md' };
  }

  function formatSectionMapMd(data) {
    data = data || SECTION_MAP;
    var parts = ['# ' + LABELS.md_pp_section_map_title, ''];
    var pages = data.page_sections || [];
    var sections = (data.items || []).filter(function(it) { return it.scope === 'section'; });
    pages.forEach(function(page) {
      var name = _md_stripBraces(page.name || page.page_id || '');
      var goal = page.goal ? ' — ' + _md_stripBraces(page.goal) : '';
      parts.push('## ' + name + goal, '');
      if (page.top_tasks_served && page.top_tasks_served.length) {
        parts.push('*' + LABELS.md_top_tasks_served + ':* ' + _md_joinChips(page.top_tasks_served), '');
      }
      var pageSections = sections.filter(function(s) { return s.page_id === page.page_id; });
      pageSections.forEach(function(s) {
        // Heading shape per schema's MD export contract:
        // ### Tytuł — {narrative} ({confidence}, {content_status})
        var heading = '### ' + _md_stripBraces(s.title || s.id || '');
        if (s.narrative) heading += ' — ' + _md_stripBraces(s.narrative);
        var pillBits = [];
        if (s.confidence)     pillBits.push(_md_confidenceLabel(s.confidence));
        if (s.content_status) pillBits.push(_md_contentStatusLabel(s.content_status));
        if (pillBits.length) heading += ' (' + pillBits.join(', ') + ')';
        parts.push(heading, '');
        if (s.goal)                parts.push('- **' + LABELS.md_goal + ':** ' + _md_stripBraces(s.goal));
        if (s.question)            parts.push('- **' + LABELS.md_question + ':** ' + _md_stripBraces(s.question));
        if (s.content_description) parts.push('- **' + LABELS.md_content_description + ':** ' + _md_stripBraces(s.content_description));
        if (s.rationale)           parts.push('- **' + LABELS.md_rationale + ':** ' + _md_stripBraces(s.rationale));
        if (s.alternatives)        parts.push('- **' + LABELS.md_alternatives + ':** ' + _md_stripBraces(s.alternatives));
        parts.push('');
      });
      parts.push('---', '');
    });
    return { md: parts.join('\n').replace(/\n+$/, '\n'), filename: NS + '-section-map.md' };
  }

  function formatInventoryMd(data) {
    data = data || INVENTORY;
    var parts = ['# ' + LABELS.md_pp_inventory_title, ''];
    var summary = data.summary || {};
    var sectionsNeeding = (typeof summary.sections_needing_content === 'number')
      ? summary.sections_needing_content
      : (data.section_index || []).filter(function(s) { return s.content_status !== 'content-ready'; }).length;
    parts.push('## ' + LABELS.md_inventory_section_summary, '');
    parts.push('- **' + LABELS.md_inventory_summary_total_templates + ':** ' + (summary.total_templates || 0));
    parts.push('- **' + LABELS.md_inventory_summary_unique_sections + ':** ' + (summary.unique_sections || 0));
    parts.push('- **' + LABELS.md_inventory_summary_sections_needing_content + ':** ' + sectionsNeeding);
    parts.push('', '---', '');
    var templateMap = data.template_map || [];
    if (templateMap.length) {
      parts.push('## ' + LABELS.md_inventory_section_template_map, '');
      templateMap.forEach(function(t) {
        var heading = '### ' + _md_stripBraces(t.name || t.id || '');
        if (t.template_type) heading += ' (' + _md_templateTypeLabel(t.template_type) + ')';
        parts.push(heading, '');
        if (t.goal)         parts.push('- **' + LABELS.md_goal + ':** ' + _md_stripBraces(t.goal));
        if (t.pages_using && t.pages_using.length) {
          parts.push('- **' + LABELS.md_pages_using + ':** ' + _md_joinChips(t.pages_using));
        }
        parts.push('');
      });
      parts.push('---', '');
    }
    var sectionIndex = data.section_index || [];
    var sectionById = {};
    sectionIndex.forEach(function(s) { sectionById[s.id] = s; });
    if (sectionIndex.length) {
      parts.push('## ' + LABELS.md_inventory_section_section_index, '');
      sectionIndex.forEach(function(s) {
        var heading = '### ' + _md_stripBraces(s.name || s.id || '');
        var pillBits = [];
        if (s.priority_tier)  pillBits.push(_md_priorityLabel(s.priority_tier));
        if (s.template_type)  pillBits.push(_md_templateTypeLabel(s.template_type));
        if (s.content_status) pillBits.push(_md_contentStatusLabel(s.content_status));
        if (pillBits.length) heading += ' (' + pillBits.join(', ') + ')';
        parts.push(heading, '');
        if (s.narrative)   parts.push('- **' + LABELS.md_narrative + ':** ' + _md_stripBraces(s.narrative));
        if (s.used_in && s.used_in.length) {
          parts.push('- **' + LABELS.md_used_in + ':** ' + _md_joinChips(s.used_in));
        }
        if (s.goal)        parts.push('- **' + LABELS.md_goal + ':** ' + _md_stripBraces(s.goal));
        if (s.question)    parts.push('- **' + LABELS.md_question + ':** ' + _md_stripBraces(s.question));
        if (s.key_message) parts.push('- **' + LABELS.md_key_message + ':** ' + _md_stripBraces(s.key_message));
        if (s.atoms && s.atoms.length) {
          parts.push('- **' + LABELS.md_atoms + ':** ' + _md_joinChips(s.atoms));
        }
        if (s.variants && s.variants.length) {
          parts.push('- **' + LABELS.md_variants + ':** ' + _md_joinChips(s.variants));
        }
        if (s.confidence)  parts.push('- **' + LABELS.md_confidence + ':** ' + _md_confidenceLabel(s.confidence));
        parts.push('');
        if (s.rationale) {
          parts.push('**' + LABELS.md_rationale + ':**', '', _md_stripBraces(s.rationale), '');
        }
        if (s.alternatives) {
          parts.push('**' + LABELS.md_alternatives + ':**', '', _md_stripBraces(s.alternatives), '');
        }
        parts.push('---', '');
      });
    }
    var templates = data.templates || [];
    if (templates.length) {
      parts.push('## ' + LABELS.md_inventory_section_template_arch, '');
      templates.forEach(function(t) {
        var heading = '### ' + _md_stripBraces(t.name || t.id || '');
        if (t.template_type) heading += ' — ' + _md_templateTypeLabel(t.template_type);
        parts.push(heading, '');
        if (t.template_type === 'standard') {
          (t.sections || []).forEach(function(secId, i) {
            var sec = sectionById[secId];
            if (!sec) { parts.push((i + 1) + '. ' + _md_stripBraces(secId)); return; }
            var name = _md_stripBraces(sec.name || sec.id);
            var narr = sec.narrative ? ' (' + _md_stripBraces(sec.narrative) + ')' : '';
            parts.push((i + 1) + '. ' + name + narr);
          });
          parts.push('');
        } else if (t.template_type === 'corporate-pool') {
          var sharedNames = (t.shared_sections || []).map(function(secId) {
            var sec = sectionById[secId];
            return _md_stripBraces(sec ? (sec.name || sec.id) : secId);
          });
          if (sharedNames.length) {
            parts.push('**' + LABELS.md_inventory_template_arch_corp_pool_shared + ':** ' + sharedNames.join(', '));
          }
          var pool = t.pool_sections || [];
          if (pool.length) {
            parts.push('**' + LABELS.md_inventory_template_arch_corp_pool_variants + ':**');
            pool.forEach(function(v) {
              var name = _md_stripBraces(v.name || v.id || '');
              var usedBy = (v.used_by && v.used_by.length) ? ' — ' + _md_joinChips(v.used_by) : '';
              parts.push('- ' + name + usedBy);
            });
          }
          parts.push('');
        } else if (t.template_type === 'modular') {
          var atoms = (t.atoms || []).map(_md_stripBraces);
          if (atoms.length) {
            parts.push('**' + LABELS.md_inventory_template_arch_modular_atoms + ':** ' + atoms.join(', '));
          }
          parts.push('');
        }
        parts.push('---', '');
      });
    }
    return { md: parts.join('\n').replace(/\n+$/, '\n'), filename: NS + '-design-plan.md' };
  }

  // ---- Universal download helper (matches audit + wireframing + messaging convention).
  function triggerDownload(filename, content, mime) {
    var blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  // Single-file HTML serialisation of all four sub-pages — clients re-open
  // standalone and see the populated canvas + panel views. Mirrors
  // messaging-canvas-template.html `_downloadHtml` pattern.
  function _downloadHtml() {
    var docClone = document.documentElement.cloneNode(true);
    var content = '<!DOCTYPE html>\n' + docClone.outerHTML;
    triggerDownload(NS + '-project-plan.html', content, 'text/html');
  }

  // ---- Wire each download button to its matching formatter / handler ----
  var dlContextBtn = document.getElementById('shellDownloadContextMd');
  if (dlContextBtn) dlContextBtn.addEventListener('click', function() {
    var r = formatContextMd(CONTEXT);
    triggerDownload(r.filename, r.md, 'text/markdown');
  });
  var dlStrategyBtn = document.getElementById('shellDownloadStrategyMd');
  if (dlStrategyBtn) dlStrategyBtn.addEventListener('click', function() {
    var r = formatStrategyMd(STRATEGY);
    triggerDownload(r.filename, r.md, 'text/markdown');
  });
  var dlSectionMapBtn = document.getElementById('shellDownloadSectionMapMd');
  if (dlSectionMapBtn) dlSectionMapBtn.addEventListener('click', function() {
    var r = formatSectionMapMd(SECTION_MAP);
    triggerDownload(r.filename, r.md, 'text/markdown');
  });
  var dlInventoryBtn = document.getElementById('shellDownloadInventoryMd');
  if (dlInventoryBtn) dlInventoryBtn.addEventListener('click', function() {
    var r = formatInventoryMd(INVENTORY);
    triggerDownload(r.filename, r.md, 'text/markdown');
  });
  var dlHtmlBtn = document.getElementById('shellDownloadHtml');
  if (dlHtmlBtn) dlHtmlBtn.addEventListener('click', _downloadHtml);

  // ---- Initial state ----
  applyStaticLabels();
  // Hide tab buttons + sub-page divs for blocks that still carry the
  // _template_stock sentinel (live mode only — demo mode shows all four).
  // Also hide each MD download button when its sub-page isn't populated, and
  // hide the entire download group when nothing is downloadable. HTML button
  // stays visible whenever any sub-page is populated. Per shared convention
  // (interactive-deliverable-shell.md §Download button convention).
  function applyTemplateStockVisibility() {
    if (DEMO_MODE) return;
    var MD_BUTTON_BY_SLUG = {
      'context':     'shellDownloadContextMd',
      'strategy':    'shellDownloadStrategyMd',
      'section-map': 'shellDownloadSectionMapMd',
      'inventory':   'shellDownloadInventoryMd'
    };
    ALL_PAGES.forEach(function(slug) {
      if (VISIBLE_PAGES.indexOf(slug) !== -1) return;
      if (pageTabs) {
        var btn = pageTabs.querySelector('.shell-bottombar__btn[data-page="' + slug + '"]');
        if (btn) btn.style.display = 'none';
      }
      var pageEl = document.getElementById('pp-page-' + slug);
      if (pageEl) pageEl.style.display = 'none';
      var dlBtn = document.getElementById(MD_BUTTON_BY_SLUG[slug]);
      if (dlBtn) dlBtn.style.display = 'none';
    });
    var dlHtmlBtn = document.getElementById('shellDownloadHtml');
    if (dlHtmlBtn && VISIBLE_PAGES.length === 0) dlHtmlBtn.style.display = 'none';
    var dlGroup = document.getElementById('shellDownloadGroup');
    if (dlGroup && VISIBLE_PAGES.length === 0) dlGroup.style.display = 'none';
  }
  applyTemplateStockVisibility();
  // Populate sub-page canvases from their JSON data blocks. Skip rendering
  // for unpopulated blocks — their .pp-page is hidden, but skipping avoids
  // wasted work + any edge-case errors on the template's stock placeholder
  // shapes.
  if (VISIBLE_PAGES.indexOf('context') !== -1)     renderContextSubPage();
  if (VISIBLE_PAGES.indexOf('strategy') !== -1)    renderStrategySubPage();
  if (VISIBLE_PAGES.indexOf('section-map') !== -1) renderSectionMapSubPage();
  if (VISIBLE_PAGES.indexOf('inventory') !== -1)   renderInventorySubPage();
  const initialHash = (location.hash || '').slice(1);
  // Prefer hash if it points at a visible page; else prefer 'context'; else
  // fall back to the first visible page (e.g. only strategy is populated).
  let initialPage;
  if (VISIBLE_PAGES.indexOf(initialHash) !== -1) {
    initialPage = initialHash;
  } else if (VISIBLE_PAGES.indexOf('context') !== -1) {
    initialPage = 'context';
  } else {
    initialPage = VISIBLE_PAGES[0];
  }
  if (initialPage) activatePage(initialPage);

  let initialOpen = null;
  try { initialOpen = localStorage.getItem(NS + '-panel-open'); } catch (e) {}
  if (initialOpen === '1') openPanel();
})();
</script>
