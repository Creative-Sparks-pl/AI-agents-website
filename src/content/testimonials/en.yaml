heading: "An organized process. Faster work.<br />That's what UX Design Skill buyers tell us."
subheading: And there's nothing like it on the market!
items:
  - pullQuote: This is a game changer!
    body: After testing UX Audit, I bought the full package the next day, and it's an awesome tool that will be my first step in setting a site's structure and strategy.
    name: Natan Domnik
    company:
      label: Pozioma
      href: https://www.pozioma.pl/
    photo: ../../assets/testimonials/natan-domnik.jpg
  - pullQuote: It's a great tool for prototyping.
    body: It's a nice addition to the process. It gives quick results based on the strategy you provide. It acts as a bridge between the strategy document and the work in Figma.
    name: Jan Kanty Janiszewski
    company:
      label: The Sunray Studio
      href: https://www.thesunraystudio.com/
    photo: ../../assets/testimonials/jan-kanty-janiszewski.jpg
  - pullQuote: A very good and useful tool, it streamlines and speeds up the work.
    body: It helps most at the early stage, and works very well as a starting point and for checking different versions.
    name: Karol Bednarczyk
    company:
      label: Modela Studio
      href: https://www.modelastudio.com/
    photo: ../../assets/testimonials/karol-bednarczyk.jpg
  - pullQuote: Guides you through the process really well 👍
    body: I'm not a web designer by trade, so pretty much everything is easier with this skill. I use it mainly at the stage of building assumptions and the interview.
    name: Karol Janus
    photo: ../../assets/testimonials/karol-janus.jpg
  - pullQuote: Very useful.
    body: It brought order to my design process, which has always been hard for me.
    name: Magda G.
    company:
      label: Freelancer
    photo: ../../assets/testimonials/magda-g.jpg
