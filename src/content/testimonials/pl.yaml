heading: Paczka zbiera świetne opinie wśród agencji i freelancerów
subheading: A podobnego produktu nie ma na rynku!
items:
  - pullQuote: Jest świetnym narzędziem do prototypowania.
    body: Jest fajnym uzupełnieniem procesu. Daje szybkie rezultaty w oparciu o dostarczoną strategię. Występuje jako pomost między dokumentem strategicznym a pracą w figmie.
    name: Jan Kanty Janiszewski
    company:
      label: The Sunray Studio
      href: https://www.thesunraystudio.com/
    photo: ../../assets/testimonials/jan-kanty-janiszewski.jpg
  - pullQuote: Bardzo przydatny.
    body: Uporządkował proces projektowy, to było zawsze trudne u mnie.
    name: Magda G.
    photo: ../../assets/testimonials/magda-g.jpg
  - pullQuote: Bardzo dobre i przydatne narzędzie, usprawnia i przyspiesza prace
    body: Pomaga najbardziej na wstępnym etapie, sprawdza się bardzo dobrze jako punkt początkowy oraz sprawdzanie różnych wersji.
    name: Karol Bednarczyk
    company:
      label: Modela Studio
      href: https://www.modelastudio.com/
    photo: ../../assets/testimonials/karol-bednarczyk.jpg
  - pullQuote: Świetnie prowadzi przez proces 👍
    body: Nie jestem web designerem by trade, więc właściwie wszystko jest łatwiejsze z tym skillem. Wykorzystuję głównie na etapie budowania założeń i wywiadu.
    name: Karol Janus
    photo: ../../assets/testimonials/karol-janus.jpg
  - pullQuote: Mówiąc krótko szacun za robotę i czapka z głowy!
    body: Po przetestowaniu UX Audit kupiłem następnego dnia pełen pakiet i jest to mega narzędzie, które będzie moim pierwszym krokiem do ustalenia struktury i strategii strony.
    name: Natan Domnik
    company:
      label: Pozioma
      href: https://www.pozioma.pl/
    photo: ../../assets/testimonials/natan-domnik.jpg
