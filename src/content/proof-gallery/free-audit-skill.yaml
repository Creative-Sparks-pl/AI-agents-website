badge: Co dostajesz
heading: Makieta strony z wnioskami w jednym pliku HTML
lead: Audyt nie kończy się raportem PDF do przeklejania. Oddaje plik HTML, który otwierasz w przeglądarce. Twoja strona jako makieta z wnioskami dopiętymi do sekcji i elementów.
cards:
