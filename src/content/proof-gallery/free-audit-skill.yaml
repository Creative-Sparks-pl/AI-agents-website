  - title: Porównanie do standardu dla Twojego typu strony
    description: "Każdy wniosek mówi 'stan obecny vs standard dla portfolio' (albo studia/małej agencji, digital productu, SaaS-a; cztery typy stron, które Skill audytuje). Każdy z oznaczonym poziomem pewności: wysoki, średni, niski."
    shape: grid
