badge: Co dostajesz
heading: Makieta strony głównej z wnioskami w jednym pliku HTML
lead: Audyt nie kończy się raportem PDF do przeklejania. Oddaje plik HTML, który otwierasz w przeglądarce. Twoja strona główna jako makieta z wnioskami dopiętymi do sekcji i elementów.
cards:
  - title: Wniosek wpięty w miejsce, którego dotyczy
    description: Bez listy zewnętrznej, do której trzeba przeskakiwać. Otwierasz HTML, widzisz odtworzony układ strony, każda sekcja i element ma podpięty komentarz audytora przy sobie.
    shape: nested
    link:
      label: Zobacz przykład audytu
      href: /examples/creativesparks-ux-designer_audit.html
  - title: Porównanie do standardu dla Twojego typu strony
    description: "Każdy wniosek mówi 'stan obecny vs standard dla Twojego typu strony'. Skill rozumie 16 typów stron, od portfolio po SaaS i marketplace. Każdy wniosek ma oznaczony poziom pewności: wysoki, średni, niski."
    shape: grid
    link:
      label: Zobacz przykład audytu
      href: /examples/creativesparks-ux-designer_audit.html
