badge: Free audit
heading: Get the free UX audit skill and run it on your homepage
intro: Get something concrete before you commit to the full version. Just give it your homepage URL. The skill takes it from there.
stages:
  - label: Stage 1
    title: Homepage scan and a wireframe of the current state
    description: A wireframe of your current homepage as HTML you preview in the browser.
    shape: cube
  - label: Stage 2
    title: Audit with diagnosis and annotations
    description: Findings as section-level annotations directly on the wireframe.
    shape: diamond
  - label: Stage 3
    title: Benchmark vs industry standards
    description: Each finding shows the current state, the industry standard for that site type, and a confidence level.
    shape: grid
note: A single audit workflow from the full skill. Checks the homepage of any of the 16 page types, up to 5 sites a day.
