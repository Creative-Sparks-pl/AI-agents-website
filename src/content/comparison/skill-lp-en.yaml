badge: Comparison
heading: "Why Claude Code alone isn't enough,<br/>and why writing your own skill isn't either."
lead: "I've been building skills since 2025 and use more than 20 of my own every day at my agency. Even so, UX Design Skill took me 6 months and four versions of its architecture: it grew from 24 files in the first version to more than 140 files and 50,000 lines."
columns:
  - key: skill
    label: UX skill (this product)
    sub: RECOMMENDED
    highlight: true
  - key: claude
    label: Claude Code alone
    sub: ALTERNATIVE
    highlight: false
  - key: diy
    label: Your own skill
    sub: ALTERNATIVE
    highlight: false
rows:
  - feature: UX methodology
    cells:
      skill:
        status: "yes"
        text: 16 page types, 13 frameworks, 50+ patterns built in.
      claude:
        status: "no"
        text: None. The model applies whatever you put in the prompt.
      diy:
        status: "partial"
        text: You write it yourself. Time cost plus risk of inconsistency.
  - feature: Time to launch
    cells:
      skill:
        status: "yes"
        text: 5 minutes. Paste the instruction from the email, and your agent installs the skill.
      claude:
        status: "partial"
        text: 0 minutes, but 0 methodology.
      diy:
        status: "no"
        text: Months of writing and testing.
  - feature: Cross-model (Claude, GPT, Gemini)
    cells:
      skill:
        status: "yes"
        text: Yes. Works in Claude Code, Codex and Cursor, and in Cursor you pick the model.
      claude:
        status: "no"
        text: Claude only, inside Claude Code. No model choice.
      diy:
        status: "partial"
        text: Yes, if you design it against the open spec yourself.
  - feature: Reasoning next to every recommendation
    cells:
      skill:
        status: "yes"
        text: Yes. Reasoning and rejected alternatives next to every decision.
      claude:
        status: "no"
        text: No. The model answers without a trail.
      diy:
        status: "partial"
        text: You'd need to design the decision log yourself.
  - feature: Cost
    cells:
      skill:
        status: "price"
        text: From $149, one-time payment.
      claude:
        status: "price"
        text: Claude Pro / Max subscription.
      diy:
        status: "price"
        text: Your time.
