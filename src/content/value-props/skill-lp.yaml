        href: "#dowod"

  - title: Wbudowana ekspertyza UX, decyzja zostaje po twojej stronie.
    description: |
      16 typów stron, 13 frameworków, 50+ wzorców wbudowane. Skill stosuje metodologię, ale każdy checkpoint pokazuje opcje z trade-offami. Decyzja zawsze twoja.
