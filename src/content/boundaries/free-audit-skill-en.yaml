badge: What the audit doesn't cover
heading: What this skill doesn't do
items:
  - icon: article
    title: It doesn't audit inner pages.
    description: It checks homepages only, up to 5 sites a day.
  - icon: block
    title: It doesn't design solutions.
    description: It diagnoses the state and points out where the standard for your site type says otherwise. Redesigning is a separate step. You do it yourself or with the full version of UX Design Skill.
  - icon: psychology
    title: It doesn't replace strategic thinking.
    description: It shows the options with the confidence level. The priority calls stay with you.
