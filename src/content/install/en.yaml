badge: Install
heading: Install by pasting one instruction
intro: You get an email with your personal install link. Paste the instruction from it into Claude Code, Codex or Cursor, and your agent installs the skill. No accounts, no onboarding queue.
items:
  - icon: mail
    label: Step 1
    title: Open the email with your link
    description: It comes from tomasz@creativesparks.pl. Not there? Check Spam or Promotions.
  - icon: content_paste
    label: Step 2
    title: Paste the instruction into your tool
    description: The link and the sentence below it, into Claude Code, Codex or Cursor. Your agent shows you the plan and asks before copying anything.
  - icon: play_arrow
    label: Step 3
    title: Start the skill with its command
    description: Like any other skill. The command is in the email.
footerLink:
  label: See the full install guide
  href: /en/ux-design-skill/how-it-works/
